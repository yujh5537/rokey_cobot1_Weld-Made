name: 작업
description: 구현·시험 작업 1건 (PR 1개로 끝나는 크기)
labels: ["type:impl"]
body:
  - type: textarea
    id: what
    attributes:
      label: 작업 내용
    validations:
      required: true
  - type: input
    id: brd
    attributes:
      label: BRD 근거
      placeholder: "예: 4.2.1~4.2.3, TR-01"
  - type: textarea
    id: scope
    attributes:
      label: 수정 범위 (Claude가 건드려도 되는 경로)
      placeholder: "ws_cobot1/src/robot_manager/"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 먼저 읽을 문서
      placeholder: "docs/contracts/ros-interfaces.md"
