name: Build demo GIFs and 5x videos

on:
  push:
    branches:
      - docs/readme-demo-archify
    paths:
      - ".github/workflows/build-demo-assets.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/readme-demo-archify
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Build 5x videos
        shell: bash
        run: |
          set -euo pipefail
          cd docs/demonstration-video

          ffmpeg -y -i "전체시연통합.webm" -an \
            -vf "crop=1080:1080:420:0,setpts=PTS/5,fps=30" \
            -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p -movflags +faststart \
            "전체시연통합-5x.mp4"

          ffmpeg -y -i "전체시연통합.webm" -an \
            -vf "crop=1080:1080:420:0,setpts=PTS/5,scale=720:720:flags=lanczos,pad=1280:720:(ow-iw)/2:0:black,fps=30" \
            -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p -movflags +faststart \
            "통합-5x.mp4"

          ffmpeg -y -i "관제통합.webm" -an \
            -vf "setpts=PTS/5,fps=30" \
            -c:v libvpx-vp9 -crf 31 -b:v 0 -deadline good -cpu-used 4 -row-mt 1 \
            "관제통합-5x.webm"

      - name: Build GIF previews
        shell: bash
        run: |
          set -euo pipefail
          cd docs/demonstration-video

          make_gif () {
            src="$1"
            dst="$2"
            width="$3"
            ffmpeg -y -i "$src" -filter_complex \
              "fps=6,scale='min(${width},iw)':-2:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
              "$dst"
          }

          make_gif "통합-5x.mp4" "통합.gif" 640
          make_gif "전체시연통합-5x.mp4" "전체시연통합.gif" 600
          make_gif "관제통합-5x.webm" "관제통합.gif" 640
          make_gif "터미널x4.mp4" "터미널x4.gif" 640

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail
          cd docs/demonstration-video
          for f in \
            "통합-5x.mp4" \
            "전체시연통합-5x.mp4" \
            "관제통합-5x.webm" \
            "통합.gif" \
            "전체시연통합.gif" \
            "관제통합.gif" \
            "터미널x4.gif"; do
            test -s "$f"
            echo "OK $(du -h "$f" | cut -f1) $f"
          done

      - name: Commit media and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm ".github/workflows/build-demo-assets.yml"
          git add docs/demonstration-video/
          git commit -m "docs: add 5x demo videos and GIF previews"
          git push origin HEAD:docs/readme-demo-archify
