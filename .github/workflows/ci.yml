name: CI

# 경로 필터를 걸지 않는다. 필수 체크(ros, web)가 실행되지 않으면 머지가 막히기 때문이다.
# 대신 각 단계가 "파일이 있을 때만" 돌도록 해서 Day 1의 빈 골격에서도 통과한다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    env:
      # 두산 메시지 패키지를 고정할 커밋. 팀이 쓰는 ws_dsr 과 같은 것으로 맞춘다.
      # 올릴 때는 ws_dsr/src/doosan-robot2 의 커밋과 같이 올린다.
      DSR_MSGS2_REPO: https://github.com/ahnisinc/cobot_rg2.git
      DSR_MSGS2_SHA: 4d5657f36a160eedb533ab1c975cd8a30c3e53b2
      DSR_WS: /opt/dsr_ws
    steps:
      - uses: actions/checkout@v4
      - name: 의존성 설치
        run: |
          apt-get update
          apt-get install -y python3-pytest
          rosdep update
          # 두산·RG2 드라이버 중 dsr_msgs2 는 아래에서 따로 빌드한다. 나머지 못 찾는 키는 건너뛴다.
          rosdep install --from-paths ws_cobot1/src --ignore-src -y -r || true

      # robot_manager 의 노드 시험은 dsr_msgs2 의 srv 타입이 있어야 돈다. 없으면 파일이
      # 통째로 skip 되어, 실기에서 로봇을 움직이는 코드가 CI 검증 밖에 있게 된다.
      # 드라이버 전체가 아니라 인터페이스 패키지 하나(688 KB)만 고정 커밋으로 받아 빌드한다.
      - name: dsr_msgs2 캐시
        id: dsr-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DSR_WS }}/install
          key: dsr-msgs2-${{ env.DSR_MSGS2_SHA }}-jazzy-ros-base
      - name: dsr_msgs2 빌드 (캐시가 없을 때만)
        if: steps.dsr-cache.outputs.cache-hit != 'true'
        run: |
          # -u 는 쓰지 않는다. /opt/ros/jazzy/setup.bash 가 AMENT_TRACE_SETUP_FILES 를
          # 미설정 상태로 참조해서 nounset 이면 source 에서 죽는다
          set -ex
          mkdir -p "$DSR_WS/src" /tmp/dsr_src
          cd /tmp/dsr_src
          git init -q .
          git remote add origin "$DSR_MSGS2_REPO"
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set doosan-robot2/dsr_msgs2
          # blob 필터 + depth 1 로 1.2 MB 만 받는다 (전체는 108 MB)
          git fetch --depth 1 --filter=blob:none origin "$DSR_MSGS2_SHA"
          git checkout FETCH_HEAD
          cp -r doosan-robot2/dsr_msgs2 "$DSR_WS/src/"
          cd "$DSR_WS"
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion-

      - name: colcon build
        working-directory: ws_cobot1
        run: |
          source /opt/ros/jazzy/setup.bash
          source "$DSR_WS/install/setup.bash"
          colcon build --event-handlers console_cohesion+
      - name: colcon test
        working-directory: ws_cobot1
        run: |
          source /opt/ros/jazzy/setup.bash
          source "$DSR_WS/install/setup.bash"
          if [ -f install/setup.bash ]; then source install/setup.bash; fi
          # 실기·DSR이 필요한 테스트는 pytest 마커 hw 로 표시하고 CI에서 제외한다
          colcon test --pytest-args -m "not hw" --event-handlers console_cohesion+
          if [ -d build ]; then colcon test-result --verbose; fi

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: frontend 빌드
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci && npm run build
          else echo "frontend 없음, 건너뜀"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FastAPI 테스트
        run: |
          if [ -f backend/app/requirements.txt ]; then
            cd backend/app && pip install -r requirements.txt pytest
            if [ -d tests ]; then python -m pytest -q; fi
          else echo "backend/app 없음, 건너뜀"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Spring Boot 빌드
        run: |
          if [ -f backend/spring/gradlew ]; then
            cd backend/spring && chmod +x gradlew && ./gradlew build --no-daemon
          else echo "backend/spring 없음, 건너뜀"; fi
      - name: compose 문법 확인
        run: |
          if [ -f docker/docker-compose.yml ]; then
            [ -f docker/.env ] || cp docker/.env.example docker/.env 2>/dev/null || true
            docker compose -f docker/docker-compose.yml config -q
          else echo "compose 없음, 건너뜀"; fi
