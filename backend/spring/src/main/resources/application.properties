# Spring Boot 서버 포트
server.port=8080

# Health Check API 활성화
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# PostgreSQL 연결
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:contact_scan}
spring.datasource.username=${POSTGRES_USER:contact_scan}
spring.datasource.password=${POSTGRES_PASSWORD:}

# 기존 T28 스키마를 그대로 사용한다.
# Spring Boot가 테이블을 자동 생성하거나 수정하지 않도록 한다.
spring.jpa.hibernate.ddl-auto=none