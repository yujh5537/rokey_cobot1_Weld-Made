# source:=robot_force 파라미터 (실기, 로봇 내장 힘 감지)
#
# - 단위: m · N · s (docs/contracts/units-frames.md). 좌표는 Base(base_link 가칭) 기준이다.
# - 아래 수치는 BRD 의 "설계 출발값"이다. 실측값이 아니다. 실기 튜닝 값은 이 파일을 PR 로 고친다
#   (브랜치 tune-MMDD-*, 커밋 'tune:'). 값을 바꾸면 옆에 날짜 · 조건 · 시험 기록(docs/test-reports/)을 적는다.
#   실기 PC 에만 남은 값은 없는 값이다(docs/conventions.md).
# - "계약 이름" 표시가 있는 파라미터는 SetConfig 가 이름으로 전파한다(ros-interfaces.md 6.4). 이름을 바꾸지 않는다.
# - over_force_n, drop_limit_m 은 여러 노드가 같은 값을 써야 한다(7.2). test/test_config.py 가 검사한다.
# - 최상위 키는 노드 이름이다. 다른 노드의 파라미터는 각 담당자가 자기 절에 추가한다.

contact_detector:
  ros__parameters:
    source: robot_force              # 'sim' | 'robot_force' (BRD 4.1.6)
    contact_threshold_n: 3.0         # 계약 이름. 접촉 임계 |F - F0|. 출발값 3~5 N 중 하한 (정의서 6.2 의 출발값은 4.0)
                                     #   하한을 고른 이유: KPI '검출 하중 5 N 이하'(BRD 9장)의 여유
                                     #   근거: PR #57 툴 등록 후 무접촉 외력 크기의 표준편차 최대 0.50 N (학민, 2026-09-19, 3자세 x 50샘플)
                                     #   하강 중 관성력은 미측정(T08 미실시). TR-01(T24)에서 확정한다
    edge_drop_m: 0.0005              # 계약 이름. 접촉 소실로 보는 z 급강하. 출발값 0.5 mm. T25 에서 확정
                                     #   0.5 mm 는 BRD 1.4 의 r = 3 mm 예시와 함께 나온 값이다. 실측 r = 0.225 mm 에서는
                                     #   팁이 모서리에 얹혀 내려가는 구간(하강량 <= r)을 넘는다. T25 에서 재검토한다
    debounce_n: 3                    # 계약 이름. 연속 N 회 유지되면 확정. 출발값 3
    over_force_n: 30.0               # 계약 이름. 과대 외력(원시 |F|). 출발값 30 N
    over_force_debounce_n: 1         # 과대 외력을 확정하는 연속 횟수. 1 = 한 샘플로 즉시. 안전 쪽으로 둔 출발값
                                     #   한 샘플 튐으로 거짓 정지가 나면 TR-01 기록을 근거로 올린다

    # --- 접촉 소실(EDGE): 누름이 확인된 뒤, 최근 구간의 z 추세선보다 edge_drop_m 넘게 내려가면 조건 성립 ---
    edge_arm_force_n: 1.5            # |F - F0| 가 이 값을 넘으면 "누르고 있다". 그 뒤부터 EDGE 를 판정한다. 설계 출발값
                                     #   아래쪽 근거: 실기 무접촉 30 s 의 |F - F0| 최대 0.447 N (2026-09-20, idle_30s.csv, 홈 자세 정지)
                                     #   위쪽 조건: robot_manager 의 slide_target_force_n(미정)보다 충분히 작아야 한다
    edge_trend_window_s: 0.5         # 추세선을 맞추는 최근 구간. 윗면 기울기 · 탐침의 느린 밀림을 흡수한다. 설계 출발값
    edge_trend_min_samples: 10       # 구간 안의 샘플이 이보다 적으면 판정하지 않는다 (실기 42.7 Hz 면 0.5 s 에 약 21 개)

    stale_age_ms: 100                # 샘플 최신성 한계(정의서 6.2 제안값). 넘게 묵은 샘플은 버리고, 간격이 넘으면 경고한다
                                     #   실기 실측 간격 최대 29 ms (2026-09-20 기록기 단독, idle_30s.csv). robot_manager 의 실기 주기는 미측정
                                     #   sim.yaml 은 Virtual 최대 97.7 ms(계약 6.3) 때문에 200 이다

    # --- tare (/contact/tare): 무접촉 · 정지 구간의 외력 평균을 기준값 F0 로 저장 ---
    tare_duration_s: 1.5             # 요청의 duration_s 가 0 일 때 쓰는 구간. BRD 4.1.3 의 1~2 s
    tare_min_samples: 30             # 구간 안의 유효 샘플이 이보다 적으면 TARE_TIMEOUT
    tare_max_std_n: 1.0              # |F - F0| 의 RMS 가 넘으면 TARE_UNSTABLE. 설계 출발값. 실기 정지 상태 실측 0.035 N (2026-09-20)
    tare_max_force_n: 6.0            # |F0| 가 넘으면 TOOL_REG_SUSPECT (BRD 4.1.5 툴 등록 점검). 병후 제안값 (PR #57 코멘트)
                                     #   실측 |F0|: 툴 등록 1.81 N (2026-09-20 홈 자세) · 2.1~2.9 N, 최대 3.7 N (2026-09-19 3자세)
                                     #             툴 미등록 11~12.5 N. 두 구간 사이가 벌어져 있어 6 N 으로 가른다
                                     #   낮게 잡으면 안 되는 이유: 탐침이 홀더 안으로 밀리는 중이면 |F0| 가 올라갈 수 있고(PR #80),
                                     #   TOOL_REG_SUSPECT 오탐이 나면 tare 가 실패해 스캔이 아예 시작되지 않는다
    # --- 하강 · 밀기 기준 분리 (#109, 2026-09-21 실기) ---
    # 외력 추정값은 마지막 이동 방향 · 자세에 따라 2~3 N 치우친다. 정지 F0 로 하강하면 허공에서 거짓 CONTACT(큐브 45 mm 위),
    # 하강용 F0 를 밀기에 쓰면 옆 이동 이력(허공에서도 Fx -5 N) 때문에 닿기 전에도 |F - F0| 가 수 N 이다
    descend_ref_window_s: 1.0        # > 0 이면 DESCEND 의 F0 를 최근 [t - 1.0, t - 0.3] s 외력 평균(이동 기준)으로 둔다. 0 = 끔(/contact/tare F0)
                                     #   근거: 추정값은 움직이기 시작하면 계단식으로 바뀌고(5-2), 107 mm 내려가는 동안 자세에 따라 1~2 N 더 흐른다.
                                     #   9/21 실기 하강 23 회 재생: 한 번 잡은 F0(이동 중 · 정지)는 1~2 회 거짓 접촉(윗면 38 · 44 · 78 mm 위),
                                     #   이동 기준은 0 회 · 윗면 z 같음
    descend_ref_lag_s: 0.3           # 구간에서 가장 최근 0.3 s 는 뺀다(오르기 시작한 샘플이 기준을 끌어올리지 않게). 설계 출발값
    descend_ref_min_samples: 10      # 구간(0.7 s, 실기 약 35 개) 안의 샘플이 이보다 적으면 기준 없음 → 둔한 판정
    descend_ref_settle_s: 5.5        # 출발 뒤 5.5 s 까지는 구간이 차도 둔한 판정(아래 6 N). 출발 약 4 s 뒤의 계단식 치우침이 구간을 지나갈 때까지
                                     #   (계단 4.1 s + 구간 1.0 s + 여유). 근거: 9/21 홈 출발 하강 22 회 모두 계단이 4.0~4.1 s(1.4~2.6 N)에 났고
                                     #   (bag_t109 17 시 · bag_t109b 17 시 54 분 · bag_t30_1806 · bag_t30_1838 · 오전 rm_real_01 · 02),
                                     #   3 N 으로 본 공중 최대 |F - F0| 도 전부 4.2~4.4 s 였다(최대 2.92 N, 오전 motion 12 홈 출발).
                                     #   5.5 s 로 재생하면 3 N 구간 공중 최대 2.04 N, 6 N 구간 최대 4.43 N. 3 mm/s 면 16.5 mm 라 윗면(107 mm)은 3 N 으로 잰다(yujh5537 리뷰, PR #127)
    descend_hold_threshold_n: 6.0    # 이동 기준이 없는 동안(출발 뒤 5.5 s · 공백 뒤)의 CONTACT 임계. 기준은 /contact/tare F0, 없으면 DESCEND 첫 샘플의 F.
                                     #   움직이기 시작할 때의 치우침(5-2 최대 3.04 N)보다 높고, 닿으면 43 N/mm 탐침에서 약 0.14 mm 로 멈춘다
                                     #   (판정을 끄면 과대 외력까지 막을 것이 없다. 현지 리뷰, PR #127). 설계 출발값
    edge_arm_still_window_s: 0.2     # > 0 이면 EDGE 판정을 z 로 켠다: 이 구간 동안 z 가 edge_arm_still_m 안에 머물고
    edge_arm_still_m: 0.0001         #   x · y 가 edge_arm_travel_m 넘게 움직였으면 "누르고 있다". edge_arm_force_n 은 쓰지 않는다
    edge_arm_travel_m: 0.0005        #   (x · y 조건: 힘 제어를 켜는 동안 팁이 떠 있는데 z 도 멈춰 있어서). 설계 출발값
    # --- 힘 꺾임 EDGE (#128). 0 = 끔. 켜는 것은 팀 결정(BRD 4.1.2 는 외력 감소를 보조 신호로 둔다) ---
    edge_force_drop_n: 0.0           # 켤 때 출발값 1.0 N. 9/21 실기 밀기 4회 재생: 1.0 N 이면 464.43 · 464.53 · 464.59 · 466.70
                                     #   (마지막은 9.8 N 으로 눌린 채 시작한 오전 1회). 모서리 앞 잡음 최대 0.65 N. 0.8 N 이면 네 번 모두 464.4~464.8
    edge_force_window_s: 0.5         # 중앙값 구간. 설계 출발값
    edge_force_lag_s: 0.1            # 구간에서 가장 최근 0.1 s 는 뺀다. 설계 출발값
    edge_force_settle_s: 1.5         # SLIDE 시작 뒤 1.5 s 는 보지 않는다. 오전 1회는 순응이 켜진 뒤 약 1 s 동안 Fz 9.8 → 0.7 N (5 mm/s 면 7.5 mm)

safety_monitor:
  ros__parameters:
    over_force_n: 30.0               # 계약 이름. contact_detector 와 같은 값
    drop_limit_m: 0.005              # 계약 이름. SLIDE 첫 샘플 z 기준 하강 제한. 출발값 5 mm
    confirm_n: 1                     # 조건을 확정하는 연속 샘플 수. 1 = 한 샘플로 즉시(안전 쪽)
    startup_grace_s: 3.0          # 기동 후 이 시간 동안은 최신성(샘플 · 상태)으로 정지 · 래치를 걸지 않는다
                                     #   근거: 2026-09-21 종단 실행에서 기동 직후 샘플이 508 ms 끊겼고,
                                     #   그때 robot_manager 는 '위치를 모르면 이동 중'이라 moving=true 였다(PR #72).
                                     #   두 보수적 기본값이 겹쳐 뜨자마자 래치가 걸렸다
                                     #   과대 외력 · 하강 제한은 유예하지 않는다
                                     #   이슈 #53(1차·2차 동시 래치) 결정 전까지 1 로 둔다. 2 이상으로 올리면
                                     #   값과 기준 z 는 계약 7.2 대로 1차와 같게 두면서 2차만 늦출 수 있다
    sample_stale_ms: 500             # /robot/sample 이 이 시간 넘게 없으면 이상. 정지를 요청하는 기준이므로
                                     #   contact_detector 의 stale_age_ms(샘플을 버리는 기준)보다 관대하게 둔다
                                     #   실기 실측 간격 최대 29 ms(2026-09-20 기록기 단독). robot_manager 의 실기 주기는 미측정
                                     #   5 mm/s 하강이면 이 시간에 2.5 mm 를 간다(drop_limit_m 5 mm 의 50 %)
                                     # 2026-09-22 300 → 500 (계약 v0.1.16 결정 3, #130). 계약 6.3 의
                                     #   "한계보다 원인이 먼저"라는 지침의 **예외**다. 이유와 되돌릴 조건:
                                     #   - 300 에서는 정지 중 약 3 s 마다 반복되는 316~365 ms 공백에 전부 걸려
                                     #     **goal 의 약 40 %가 SAMPLE_STALE 로 정지**했다(9/22 17:54 실기). 접촉 위치에서
                                     #     바로 안전복귀가 나간 것도 2회. 정지가 정상 동작을 막는 상태였다
                                     #   - 기록된 공백 14개(316~365 ms 12개 · 464 · 687) 중 300 은 14개 전부,
                                     #     500 은 **687 하나만** 걸린다(safety_core 재현)
                                     #   - **687 ms 공백이 실제로 있었으므로 500 도 완전하지 않다.** 700 으로 더
                                     #     올리는 것은 **지금 하지 않는다** — 데이터가 더 쌓인 뒤 검토만 한다.
                                     #     공백 동안에는 1차 · 2차가 모두 앞을 보지 못하고, 길수록 하강 제한 감시도 늦다
                                     #   - **되돌릴 조건**: #130 의 근본 원인(약 3 s 주기 지연)이 해결되면 300 으로 되돌린다
                                     #   sim 도 500 이라 역전되지 않는다. robot_status_timeout_ms(500)와 같아진다
    robot_status_timeout_ms: 500     # /robot/status 미수신. Virtual 실측 9.3~9.8 Hz(약 107 ms)의 약 5 배. 실기는 미측정

    # --- 정지 요청 (접수 ≠ 정지 완료. 완료는 /robot/status 의 connected && !moving 으로만 본다) ---
    stop_confirm_timeout_s: 0.6      # 이 안에 정지가 확인되지 않으면 사유를 올리고 다시 요청한다. 설계 출발값
                                     #   하한 근거: robot_manager 의 moving_window_s 0.3 + 상태 발행 간격 약 0.13
                                     #   + 서비스 왕복 = 약 0.45 s. T32(TR-08 실기 중지 검증)에서 확정한다
                                     #   BRD 9장 KPI '작업 중지 반응 1초 이내'보다 작아야 한다
    stop_retry_period_s: 2.0         # 확인되지 않을 때 다시 요청하는 간격. 느리게 둔다 — 드라이버가 응답하지 않는
                                     #   원인이 호출 과부하일 수 있다(docs/env/api-check-log.md). 세게 두드리면 더 나빠진다
    status_publish_period_s: 1.0     # /safety/status 주기 발행. 상태가 바뀌면 이 값과 무관하게 바로 발행한다
    check_period_s: 0.05             # 최신성 · 정지 확인 시간 초과를 보는 주기

robot_manager:
  ros__parameters:
    home_joint_deg: [-21.19, 15.24, 52.97, -0.08, 111.80, -15.14]   # OP_HOME 목적지(관절각 J1~J6, deg). 없으면 robot_manager 가 OP_HOME 을 거절한다
                                     #   units-frames.md 의 홈위치 관절각 [v0.1.18]. 2026-09-22 작업대 교체 뒤 학민이 다시 잡았다(9/23 확인)
                                     #   이 자세의 팁(TCP [0, 0, 252.12]) = (421.0, -156.0, 294.39) mm, 탐침 수직(툴 z 축이 Base -z 와 0.005° 안)
                                     #   옛 홈 [-24.14, 17.03, 51.68, -0.18, 111.39, -204.84] 는 무효다. J6 을 ±180° 안(-15.14)으로 옮겼다
    home_speed_deg_s: 20.0           # 홈 복귀 관절 속도. 실기는 낮춘다
    drop_limit_m: 0.005              # 계약 이름. safety_monitor 와 같은 값
    slide_target_force_n: 3.0        # 계약 이름 [N]. 출발값이고 잠정이다.
                                     #   ⚠️ set_desired_force 를 DR_FC_MOD_REL 로 부른다. 드라이버
                                     #   정의가 "relative to initial state (the instance when this
                                     #   function is called)" 이므로, 이 값은 tare 대비가 아니라
                                     #   **호출 시점에 이미 실려 있는 힘에 더해지는 값**이다.
                                     #   SLIDE 는 DESCEND 가 접촉으로 끝난 직후에 오므로 기준선이
                                     #   접촉력(증분 3~5 N 추정)이고, 실제 누름은 그만큼 더 커진다.
                                     #   실기에서 SLIDE 시작 로그의 기준선 Fz 를 보고 정한다 (#73).
                                     #   ⚠️ edge_arm_force_n · contact_threshold_n 과 직접 비교하지
                                     #   않는다. 그 둘은 tare 대비 증분(|F − F0|)이고 이 값은 호출
                                     #   시점 기준이라, 기준이 다른 값끼리는 대소 비교가 성립하지
                                     #   않는다 (현지 리뷰, PR #73). 실제 누름을 tare 기준으로
                                     #   환산하려면 SLIDE 시작 로그의 기준선 Fz 를 더해야 한다.
                                     #   9/20 실기 편향 2.25 mm 는 tare 대비 증분 2~4 N 에서 잰 값이다(밀린 탐침이라 무효, units-frames.md v0.1.11).
                                     #   확정 순서: 이동 중 잡음 → 임계 → 누름 힘 → 편향 (병후)
    compliance_stiffness: [3000.0, 3000.0, 3000.0, 200.0, 200.0, 200.0]
                                     # task_compliance_ctrl 강성 [N/m ×3, N·m/rad ×3].
                                     #   두산 기본값. 실기에서 조정한다
    arrival_tolerance_m: 0.003       # OP_MOVE_TO 도착 판정 허용치 [m]. 멈춘 것과 도착한 것은
                                     #   다르다. 이 값을 넘으면 TARGET_REACHED 가 아니라
                                     #   ROBOT_ERROR 다. 출발값이고 실기에서 확정한다 (#73)
    arrival_grace_s: 1.0             # 명령 후 이 시간 안에 안 움직이면 도착으로 본다 [s]
    motion_timeout_s: 120.0          # goal.timeout 이 0 일 때(손으로 보낸 goal, t25_all.sh) 쓰는 제한 [s]. 스텝 모드 SLIDE 는
                                     #   한 방향에 50~70 s 라 코드 기본 60 이면 끊긴다. scan_manager 의 motion_timeout_s 와 같은 값
    move_restart_max: 1              # 이동 명령이 arrival_grace_s 안에 출발하지 않으면 move_stop 뒤 같은 명령을 다시 보내는 최대 횟수.
                                     #   0 이면 끈다. SLIDE 와 MOVE_TO 에 쓴다(MOVE_TO 는 아직 도착 허용치 밖일 때만).
                                     #   9/22 실기: 힘 제어를 켠 뒤 보낸 amovel 을 드라이버가 32 회 중 8 회 실행하지 않았다(#153).
                                     #   9/23 실기 12:52: 모서리 뒤 올림(50 mm)이 86 ms 만에 끝나고 한 걸음도 가지 않아 통합 스캔이 중단됐다
    release_force_time_s: 0.3        # release_force 의 강성 제어 전환 시간 [s] (0~1.0).
                                     #   0 이면 즉시 전환이라 참조 외력이 점프한다
                                     #   (두산 매뉴얼 5.1.4 알아두기). 실기에서 확인한다
    frame_id: base_link              # units-frames.md 가칭. 계약에서 확정되면 같이 바꾼다
    dsr_namespace: dsr01
    sample_rate_hz: 50.0             # 설정값. 실측은 Virtual 37.6 Hz, 실기 42.8 Hz
    status_rate_hz: 10.0
    service_timeout_s: 0.5
    slow_call_warn_s: 0.15           # 이보다 늦은 두산 서비스 응답을 이름 · 시간과 함께 남긴다(#130). 0 이면 끈다.
                                     #   9/21 실기: 정지 중 · 모션 중 모두 약 3 s 주기로 한 호출이 330~365 ms 늦었다(평소 4~20 ms)
    moving_eps_m: 0.0002             # 이 창 안에서 이만큼 움직이면 이동 중.
                                     #   실기 posx 잡음이 0.2 mm 를 넘으면 영원히 '이동 중'이 되어
                                     #   정지 완료가 안 나오고, 너무 크면 느린 하강을 정지로 본다.
                                     #   실기에서 확인해 조정한다 (다음 세션 'moving 오탐 여부')
    moving_window_s: 0.3
                                     #   ⚠️ 이 둘이 지켜 주는 최저 속도는 moving_eps_m / moving_window_s = 0.2 mm / 0.3 s ≈ 0.67 mm/s 다.
                                     #      그보다 느리면 창을 다 덮어도 변위가 eps 에 못 미쳐 움직이는 로봇이 '멈췄다'로 읽힌다.
                                     #      1 mm/s 는 창 하나에 0.3 mm 로 여유가 1.5 배뿐이다. 하강 속도를 내리려면 이 둘을 같이 본다
    moved_min_m: 0.001               # 동작 방향으로 이만큼 넘게 가야 "움직였다"(도착 판정용) [m]. SLIDE 는 x · y 만 본다.
                                     #   힘 제어를 켤 때 z 0.3~0.5 mm 움직임을 출발로 보지 않는다(9/22 실기 1083)
    # --- SLIDE 방식 (계약 7.2 스텝 모드, v0.1.15) ---------------------------------------------------
    slide_mode: step                 # force = 순응 · 힘 제어로 끊지 않고 민다(위 slide_target_force_n · compliance_stiffness).
                                     #   step = 위치 제어로 한 스텝 가고 멈춘 뒤 힘을 읽어 z 를 맞추며 긁는다(step_slide.py).
                                     #   9/17 tactile_probe 프로토타입이 같은 M0609 로 네 방향을 한 번에 끝낸 방식.
                                     #   힘 제어 밀기는 9/22 실기에서 방향별 누름 1.5~8.6 N 편차 · 뜸 · 가짜 EDGE 로 막혔다.
                                     #   step 이면 EDGE 는 robot_manager 가 확정해 /contact/event 로 낸다(source robot_step).
                                     #   아래 step_* 는 step 일 때만 읽는다. 값은 설계 출발값 — 실기 첫 시험에서 확정한다
    step_coarse_m: 0.0005            # 긁기 스텝 [m]. 프로토타입 0.5 mm
    step_fine_m: 0.0001              # 모서리 다듬기 스텝 [m]. 모서리 반복도의 분해능
    step_z_m: 0.00005                # 누름 맞추기 z 스텝 [m]. 새 탐침 0.1 mm 당 약 1.4 N(t25_all.sh) → [3, 7] N 띠가 약 0.3 mm
    step_press_step_m: 0.0001        # 시작 자리에서 처음 누를 때 내려가는 스텝 [m]
    step_press_max_m: 0.003          # 시작 자리에서 내려갈 수 있는 최대 [m]. 방향 전환 뒤 recontact_margin_m(1 mm) 떠서 와도 닿는다.
                                     #   step_press_max_m + step_drop_m < drop_limit_m 이어야 한다(하강 제한에 먼저 걸린다)
    step_lift_m: 0.001               # 기준 힘을 잴 때 · 끝났을 때 드는 높이 [m]
    step_nudge_m: 0.001              # 기준 힘 전에 긁을 방향으로 움직이는 거리 [m]. 마지막 이동 방향을 긁기와 같게 둔다
                                     #   (9/21 1-1절: 멈춘 상태에서도 마지막 이동 방향만으로 Fz 가 1.9 N 다르다)
    step_release_n: 2.5              # ΔFz 가 이 아래면 접촉이 약함 / 소실 [N]. 정지 잡음 ±0.5 N 의 3 배
    step_follow_lo_n: 3.0            # 누름 하한 [N]. 이보다 약하면 z 를 더 내린다
    step_follow_hi_n: 7.0            # 누름 상한 [N]. 이보다 세면 z 를 올린다
    step_max_force_n: 12.0           # |ΔF| 가 이보다 크면 들고 중단 [N]. over_force_n(15) 보다 작게
    step_side_hit_n: 8.0             # 수평 |ΔF| 가 이보다 크면 물러나고 중단 [N]. 프로토타입 마찰 수평 힘 약 2.6 N
    step_drop_m: 0.0005              # 힘이 빠졌을 때 최근 접촉 높이보다 이만큼 아래까지 내려가 본다 [m]. 이때도 안 닿아야 모서리
    step_z_tol_m: 0.001              # 긁는 동안 누르는 높이 변화 한계의 최솟값 [m]. 넘으면 탐침 밀림 · 물체 이동으로 보고 중단
    step_max_slope_deg: 5.0          # 높이 변화 한계 = max(step_z_tol_m, 긁은 거리 × tan(이 각도))
    step_settle_s: 0.15              # 멈춘 뒤 힘을 읽기 전 대기 [s]. 프로토타입 0.1
    step_force_samples: 3            # 그 뒤 새로 받은 샘플 몇 개를 평균낼지. 42.8 Hz 면 3 개 ≈ 70 ms
    step_still_m: 0.00005            # 이 창 동안 위치 변화가 이 이하면 멈춤 [m]. posx 정지 잡음보다 커야 한다
    step_still_window_s: 0.15
    step_move_timeout_s: 2.0         # 한 스텝이 (거리/속도 + 이 값) 안에 멈추지 않으면 중단 [s]. 출발하지 않았으면 한 번 다시 보낸다(#153)

scan_manager:
  ros__parameters:
    state_publish_period_s: 1.0      # /scan/state 주기 발행 간격(s). 상태가 바뀌면 이 값과 무관하게 바로 발행한다
                                     #   0 이하면 노드가 기동하지 않는다. 설계 출발값이며 실측값이 아니다 (병후, PR #50)
    # --- T19a (병후). 아래 수치는 설계 출발값이다. 실측값이 아니다(tip_radius_m 한 줄만 실측) ---
    # 필수 항목이 비어 있으면 노드는 기동하되 START 를 INVALID_VALUE 로 거절하고 빠진 이름을 알려 준다(코드 예비값 없음).
    # **TBD 로 남긴 항목을 채우기 전에는 실기에서 START 가 거절된다. 의도한 fail-safe 다.**
    # descend_speed_mps:             # 계약 이름. TBD (계약 9장). 하강 중 관성력 · 감속 거리로 정한다(T13 · T24)
    # slide_speed_mps:               # 계약 이름. TBD
    # max_descend_m:                 # 계약 이름. TBD. 조건은 units-frames.md '탐색 기준점 높이': 하한 = 기준점 → 부재 윗면 거리 + 여유,
                                     #   상한 < 기준점 팁 높이 - 안전 여유(넘으면 부재가 없을 때 작업대 면을 윗면으로 잡는다)
    # max_slide_m:                   # 계약 이름. TBD. 부재 크기 · 작업영역으로 정한다
    # motion_timeout_s:              # 계약 이름. TBD. **이 값이 없으면 START 뿐 아니라 안전복귀(/scan/home)도 거절된다**
                                     #   (OP_HOME 에 실을 제한 시간이다. 실기 세션 전에 가장 먼저 채운다)
    # --- 모션 (계약 이름). 실기는 sim 보다 보수적으로 둔다. 전부 설계 출발값이며 실측이 아니다 ---
    descend_speed_mps: 0.003         # OP_DESCEND 속도. 저속 등속(BRD 4.2.1: 가감속 관성력이 외력으로 읽히는 것을 피한다)
                                     #   느릴수록 판정 지연이 거리로 덜 환산된다. TR-01(T24)에서 조정
    slide_speed_mps: 0.005           # OP_SLIDE 속도. 편향은 속도에 비례하므로 sim(0.010)보다 낮춘다. T25 에서 조정
    max_descend_m: 0.050             # 미접촉 실패 한계 [v0.1.18 잠정]. 기준점(아래 search_origin_pose z 218.0 mm)에서
                                     #   윗면(178.003)까지 40 mm. 하한 = 40 + 여유 5 = 0.045 < 0.050 < 상한 = 기준점 → 지지면
                                     #   (218.0 − 95.006 − 테이프 약 2) − 여유 5 ≈ 0.116. 판정이 실패해도 윗면 아래 10 mm 안이고
                                     #   그 전에 과대 외력이 멈춘다. ⚠️ 부재가 없으면 팁이 작업대 위 약 73 mm(218.0 − 50 − 95.006, 테이프 윗면 기준 71 mm)에서 멈춘다
                                     # (이력, 무효) 0.120 — 옛 홈 팁 높이 187.34 mm · 80 mm 큐브 기준(v0.1.11)
    max_slide_m: 0.060               # 미소실 실패 한계. 부재 약 81 mm(캘리퍼 확정 전)의 반폭 약 0.041 + 원점 오프셋 약 0.001 + 여유.
                                     #   원점이 윗면 중심이라 네 방향 모두 같은 여유다 [v0.1.18]
    motion_timeout_s: 120.0          # 단위 모션 제한. 스텝 모드 SLIDE(robot_manager slide_mode: step)는 40 mm 에 약 50~70 s
                                     #   (0.5 mm 스텝마다 멈춰 힘을 읽는다, 프로토타입 실측 스텝당 0.4~0.5 s). 60 이면 모자란다
    move_speed_mps: 0.030            # OP_MOVE_TO 속도(기준점 이동 · 방향 전환의 올림과 수평 이동 · 마무리 들어 올림)
    recontact_speed_mps: 0.002       # 방향 전환 뒤 내림 속도. 이동 속도가 아니라 저속이어야 한다(계약 7.3)
    lift_height_m: 0.05              # 계약 이름. 방향 전환 · 마무리 때 팁 상승량. 출발값 50 mm (BRD 4.2.6)
    # move_speed_mps:                # OP_MOVE_TO 속도. TBD. robot_manager 는 OP_HOME 이 아닌 goal 의 speed <= 0 을 거절한다(PR #73)
    recontact_margin_m: 0.001        # 방향 전환 뒤 내림 목표 = 첫 접촉 z + 이 값. 출발값 1 mm (계약 7.3). drop_limit_m 보다 충분히 작아야 한다
    # recontact_speed_mps:           # 방향 전환 뒤 내림 속도(저속). TBD (계약 9장)
    # --- 좌표 [v0.1.18 잠정, 2026-09-23] 2026-09-22 작업대 교체 뒤 학민 실측(TCP [0, 0, 252.12] 등록 세션) ---
    #   ⚠️ TCP 를 [0, 0, 252.12] 로 등록한 세션에서만 맞다. **START 전에 등록을 확인한다**(units-frames 세션 시작 점검 2):
    #      등록이 빠지면 첫 OP_MOVE_TO 가 플랜지를 기준점으로 보내 팁이 약 252 mm 아래(작업대 아래)로 간다(#123)
    #   잠정인 이유: z=0 이 1 점뿐이고 테이프 두께(support_z_m)를 아직 재지 않았다. 재면 두 줄만 고친다(#147)
    search_origin_pose: [0.420255, -0.156675, 0.218, 0.05155162, 0.99867033, 0.0, 0.0]
                                     # 탐색 기준점. Base, x y z qx qy qz qw. x · y = 작업대 원점(부재 윗면 중심),
                                     #   z = 윗면 178.003 + 40 mm(윗면 위 20 mm 이상이어야 3 N 으로 판정한다: #127 settle 5.5 s + 창 1 s),
                                     #   자세 = 새 홈 자세(탐침 수직, ZYZ 87.17, 180.00, 93.08 deg)를 robot_manager 변환식으로 바꾼 값
    base_to_fixture: [0.420255, -0.156675, 0.095006]
                                     # 작업대 원점의 Base 좌표 x y z. 평행 이동만. x · y = 9/22 스텝 모드 네 모서리의 가운데,
                                     #   z = 작업대 표면(z=0) 95.006 mm, 1 점 (524.97, -172.03). **z 는 윗면이 아니라 지지면이다**
                                     # (이력, 무효) v0.1.11 [0.42356, -0.18606, 0.100503] · search_origin_pose [0.42356, -0.18606, 0.28784, ...]
    support_z_m: 0.002               # 지지면 높이(작업대 좌표) [v0.1.18 잠정]. 부재가 코끼리테이프 위에 놓였고 z=0 은 테이프 없는 면이다.
                                     #   테이프 두께 약 2 mm(병후). 테이프 윗면을 힘 접촉으로 재면 확정한다. 0 이면 높이가 약 2 mm 크게 나온다
    detect_latency_s: 0.0            # 편향 보정 지연 t [v0.1.18]. 0 이 정당한 값이다(params.py): 실기 SLIDE 는 스텝 모드라
                                     #   멈춘 뒤 EDGE 를 확정하므로 속도 × 지연 항이 없다(계약 ros-interfaces 7.2 스텝 모드, PR #160 후속 2).
                                     #   대가: 윗면 CONTACT 의 보정(하강 3 mm/s × t)도 같이 빠진다. 0.020 이면 0.06 mm 였다
                                     #   force 모드로 되돌리면 아래 근거대로 0.020 으로 되돌린다
                                     # (이력) 0.020 — 설계 출발값이며 실측이 아니었다
                                     #   구성: 샘플 주기의 절반(실기 42.7 Hz 면 약 12 ms) + 조회 왕복(get_tool_force 4~7 ms, PR #66)
                                     #        + 실제 접촉부터 힘이 임계에 닿기까지(금속이라 짧을 것으로 보지만 **미측정**)
                                     #   계약 v0.1.5 로 판정 샘플이 '조건이 처음 성립한 샘플'이 되어 디바운스 몫은 빠졌다
                                     #   sim.yaml 은 가상 강성 모델이 있어 근거가 다르다(그쪽 주석 참고)
                                     #   T24 에서 detect_stamp - force_stamp 로 실측해 바꾼다
    tip_radius_m: 0.002              # 편향 보정 r. **반지름**이다 [v0.1.18 잠정]. 2026-09-21 교체한 탐침, 약 2 mm(병후 · 학민 확인, 캘리퍼 확정 전).
                                     #   근거: 9/22 폭 83.55 · 84.15 와 높이 82.997(테이프 포함)이 r 2 mm · 테이프 2 mm · 부재 약 81 mm 로 함께 맞는다
                                     #   ⚠️ 스텝 모드의 δ(z_drop_m)는 step_drop_m(0.5 mm) 에서 잘린 값이라 d = √(2rδ − δ²) ≈ 1.32 mm 는
                                     #   측정이 아니라 파라미터의 함수다. r · step_drop_m 의 오차는 edge_bias_offset_m(T25, 스텝 모드로 잰다)이 흡수한다
                                     # (이력) 0.000225 — 2026-09-19 탐침(인공눈물 용기 끝, 지름 0.45 mm). 9/21 교체 뒤에 재지 않았었다
    # detect_latency_s:              # 편향 보정 지연 t. TBD (T24 · T30 실측). '판정 샘플'의 정의(이슈 #69)에 따라 뜻이 달라진다
    edge_round_radius_m: 0.0         # 부재 모서리 둥글림 R. 기준 큐브는 모서리가 예리하다: 라운드 없음
                                     #   [v0.1.18] 부재 치수는 80 이 아니라 약 81 mm(캘리퍼 확정 전). 예리함은 #147 측정 1 에서 다시 본다
                                     #   실측: 2026-09-20 학민, 캘리퍼 · 손끝(PR #80, docs/test-reports/T03-follow-up_20260920.md).
                                     #   2026-09-19 의 라운드 가설은 폐기됐다. 다른 부재를 쓰면 다시 잰다. 0 이 정당한 값이다
    edge_bias_offset_m: 0.0          # 실측 나머지 편향. **아직 재지 않아 0 이다.** T25 에서 누름 힘별로 재서 채운다.
                                     #   PR #80 의 2.25 mm 는 홀더 안으로 밀린 탐침으로 잰 값이라 무효다(units-frames.md v0.1.11). 새 탐침으로 다시 잰다
                                     #   스칼라 하나, 방향당 값((추정 폭 - 캘리퍼 폭) / 2). 검출점이 진행 방향으로 더 나간 거리가 + 이고,
                                     #   geometry_estimator 가 그만큼 진행 방향 반대로 뺀다(README, PR #75)
    result_dir: data                 # result_store 경로. 상대 경로는 노드를 띄운 셸의 현재 디렉터리 기준이다
                                     #   ws_cobot1 에서 launch 하면 ws_cobot1/data (gitignore). 실기 PC 에만 남은 기록은 없는 기록이다
    result_frame_id: workpiece_fixture    # ScanResult 의 프레임(가칭)
    motion_frame_id: base_link            # ExecuteMotion goal 의 프레임(가칭)
    direction_order: [POS_X, NEG_X, POS_Y, NEG_Y]   # 모서리 탐색 순서. 기동할 때만 읽는다
    event_wait_timeout_s: 1.0        # Result 가 가리킨 ContactEvent 를 기다리는 한도. 설계 출발값
    stop_confirm_timeout_s: 5.0      # 정지 완료(connected && !moving)를 기다리는 한도. 설계 출발값
    server_wait_timeout_s: 2.0       # 상대 서버의 미기동 판단. 설계 출발값
    # --- 상태 토픽이 끊긴 것을 보는 한도 (이슈 #120, 병후). 설계 출발값이며 실측값이 아니다 ---
    # /safety/status · /robot/status 는 TRANSIENT_LOCAL 이라 발행자가 죽어도 마지막 메시지가 남는다.
    # 마지막 stamp 가 이 값보다 오래되면 "끊김"으로 보고 START · 재시작을 거절한다(안전복귀는 /safety/status 를 보지 않는다).
    # 너무 짧게 잡으면 발행이 잠깐 늦은 것만으로 부당 거절이 난다. 발행 주기의 여러 배로 둔다.
    safety_status_timeout_s: 5.0     # safety_monitor.status_publish_period_s(1.0) 의 5 배
    robot_status_timeout_s: 2.0      # robot_manager.status_rate_hz(10 Hz = 0.1 s) 의 20 배.
                                     #   정지 중 300~360 ms 의 샘플 공백이 보고돼 있다(이슈 #130) — 그 5 배 이상으로 둔다

mqtt_bridge:
  ros__parameters:
    broker_port: 1883
