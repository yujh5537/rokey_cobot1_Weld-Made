# source:=robot_force 파라미터 (실기, 로봇 내장 힘 감지)
#
# - 단위: m · N · s (docs/contracts/units-frames.md). 좌표는 Base(base_link 가칭) 기준이다.
# - 아래 수치는 BRD 의 "설계 출발값"이다. 실측값이 아니다. 실기 튜닝 값은 이 파일을 PR 로 고친다
#   (브랜치 tune-MMDD-*, 커밋 'tune:'). 값을 바꾸면 옆에 날짜 · 조건 · 시험 기록(docs/test-reports/)을 적는다.
#   실기 PC 에만 남은 값은 없는 값이다(docs/conventions.md).
# - "계약 이름" 표시가 있는 파라미터는 SetConfig 가 이름으로 전파한다(ros-interfaces.md 6.4). 이름을 바꾸지 않는다.
# - over_force_n, drop_limit_m 은 여러 노드가 같은 값을 써야 한다(7.2). test/test_config.py 가 검사한다.
# - 최상위 키는 노드 이름이다. 다른 노드의 파라미터는 각 담당자가 자기 절에 추가한다.

contact_detector:
  ros__parameters:
    source: robot_force              # 'sim' | 'robot_force' (BRD 4.1.6)
    contact_threshold_n: 3.0         # 계약 이름. 접촉 임계 |F - F0|. 출발값 3~5 N 중 하한 (정의서 6.2 의 출발값은 4.0)
                                     #   하한을 고른 이유: KPI '검출 하중 5 N 이하'(BRD 9장)의 여유
                                     #   근거: PR #57 툴 등록 후 무접촉 외력 크기의 표준편차 최대 0.50 N (학민, 2026-09-19, 3자세 x 50샘플)
                                     #   하강 중 관성력은 미측정(T08 미실시). TR-01(T24)에서 확정한다
    edge_drop_m: 0.0005              # 계약 이름. 접촉 소실로 보는 z 급강하. 출발값 0.5 mm. T25 에서 확정
                                     #   0.5 mm 는 BRD 1.4 의 r = 3 mm 예시와 함께 나온 값이다. 실측 r = 0.225 mm 에서는
                                     #   팁이 모서리에 얹혀 내려가는 구간(하강량 <= r)을 넘는다. T25 에서 재검토한다
    debounce_n: 3                    # 계약 이름. 연속 N 회 유지되면 확정. 출발값 3
    over_force_n: 30.0               # 계약 이름. 과대 외력(원시 |F|). 출발값 30 N
    over_force_debounce_n: 1         # 과대 외력을 확정하는 연속 횟수. 1 = 한 샘플로 즉시. 안전 쪽으로 둔 출발값
                                     #   한 샘플 튐으로 거짓 정지가 나면 TR-01 기록을 근거로 올린다

safety_monitor:
  ros__parameters:
    over_force_n: 30.0               # 계약 이름. contact_detector 와 같은 값
    drop_limit_m: 0.005              # 계약 이름. SLIDE 첫 샘플 z 기준 하강 제한. 출발값 5 mm

robot_manager:
  ros__parameters:
    drop_limit_m: 0.005              # 계약 이름. safety_monitor 와 같은 값
    # slide_target_force_n:          # 계약 이름. 값 TBD (학민)
    frame_id: base_link              # units-frames.md 가칭. 계약에서 확정되면 같이 바꾼다
    dsr_namespace: dsr01
    sample_rate_hz: 50.0             # 설정값. 실측은 Virtual 37.6 Hz, 실기 42.8 Hz
    status_rate_hz: 10.0
    service_timeout_s: 0.5
    moving_eps_m: 0.0002             # 이 창 안에서 이만큼 움직이면 이동 중.
                                     #   실기 posx 잡음이 0.2 mm 를 넘으면 영원히 '이동 중'이 되어
                                     #   정지 완료가 안 나오고, 너무 크면 느린 하강을 정지로 본다.
                                     #   실기에서 확인해 조정한다 (다음 세션 'moving 오탐 여부')
    moving_window_s: 0.3

scan_manager:
  ros__parameters:
    state_publish_period_s: 1.0      # /scan/state 주기 발행 간격(s). 상태가 바뀌면 이 값과 무관하게 바로 발행한다
                                     #   0 이하면 노드가 기동하지 않는다. 설계 출발값이며 실측값이 아니다 (병후, PR #50)
    # --- T19a (병후). 아래 수치는 설계 출발값이다. 실측값이 아니다(tip_radius_m 한 줄만 실측) ---
    # 필수 항목이 비어 있으면 노드는 기동하되 START 를 INVALID_VALUE 로 거절하고 빠진 이름을 알려 준다(코드 예비값 없음).
    # **TBD 로 남긴 항목을 채우기 전에는 실기에서 START 가 거절된다. 의도한 fail-safe 다.**
    # descend_speed_mps:             # 계약 이름. TBD (계약 9장). 하강 중 관성력 · 감속 거리로 정한다(T13 · T24)
    # slide_speed_mps:               # 계약 이름. TBD
    # max_descend_m:                 # 계약 이름. TBD. 조건은 units-frames.md '탐색 기준점 높이': 하한 = 기준점 → 부재 윗면 거리 + 여유,
                                     #   상한 < 기준점 팁 높이 - 안전 여유(넘으면 부재가 없을 때 작업대 면을 윗면으로 잡는다)
    # max_slide_m:                   # 계약 이름. TBD. 부재 크기 · 작업영역으로 정한다
    # motion_timeout_s:              # 계약 이름. TBD. **이 값이 없으면 START 뿐 아니라 안전복귀(/scan/home)도 거절된다**
                                     #   (OP_HOME 에 실을 제한 시간이다. 실기 세션 전에 가장 먼저 채운다)
    lift_height_m: 0.05              # 계약 이름. 방향 전환 · 마무리 때 팁 상승량. 출발값 50 mm (BRD 4.2.6)
    # move_speed_mps:                # OP_MOVE_TO 속도. TBD. robot_manager 는 OP_HOME 이 아닌 goal 의 speed <= 0 을 거절한다(PR #73)
    recontact_margin_m: 0.001        # 방향 전환 뒤 내림 목표 = 첫 접촉 z + 이 값. 출발값 1 mm (계약 7.3). drop_limit_m 보다 충분히 작아야 한다
    # recontact_speed_mps:           # 방향 전환 뒤 내림 속도(저속). TBD (계약 9장)
    # search_origin_pose:            # 탐색 기준점 상공. Base, x y z qx qy qz qw. **TBD**: units-frames.md 에서 기준점 높이가 초안이다
                                     #   자세는 수직 고정. 오일러로 두지 않는다(두산 ZYZ 규약 혼동)
    # base_to_fixture:               # 작업대 원점의 Base 좌표 x y z. 평행 이동만. **TBD**
                                     #   units-frames.md v0.1.3 의 초안은 [0.42356, -0.18606, 0.1006] 이다(2026-09-19 학민, PR #60).
                                     #   그 세션 한정 초안이고 부재를 같은 자리에 놓는 방법이 없어, 값을 확인한 사람이 날짜 · 조건과 함께 넣는다
    support_z_m: 0.0                 # 지지면 높이(작업대 좌표). z=0 이 작업대 표면이다(units-frames.md). 0 이 정당한 값이다
    tip_radius_m: 0.000225           # 편향 보정 r. **반지름**이다(지름 0.45 mm). 실측: 2026-09-19 학민, 인공눈물 용기 끝(units-frames.md, PR #57)
    # detect_latency_s:              # 편향 보정 지연 t. TBD (T24 · T30 실측). '판정 샘플'의 정의(이슈 #69)에 따라 뜻이 달라진다
    # edge_round_radius_m:           # 부재 모서리 둥글림 R. TBD (블록 실측). 기준 큐브에 라운드가 있을 가능성이 있다(units-frames.md, 미확인 가설)
    edge_bias_offset_m: 0.0          # 실측 나머지 편향. T30 실측 전이라 0. 스칼라 하나, 방향당 값, 진행 방향 + (PR #75)
    result_dir: data                 # result_store 경로. 상대 경로는 노드를 띄운 셸의 현재 디렉터리 기준이다
                                     #   ws_cobot1 에서 launch 하면 ws_cobot1/data (gitignore). 실기 PC 에만 남은 기록은 없는 기록이다
    result_frame_id: workpiece_fixture    # ScanResult 의 프레임(가칭)
    motion_frame_id: base_link            # ExecuteMotion goal 의 프레임(가칭)
    direction_order: [POS_X, NEG_X, POS_Y, NEG_Y]   # 모서리 탐색 순서. 기동할 때만 읽는다
    event_wait_timeout_s: 1.0        # Result 가 가리킨 ContactEvent 를 기다리는 한도. 설계 출발값
    stop_confirm_timeout_s: 5.0      # 정지 완료(connected && !moving)를 기다리는 한도. 설계 출발값
    server_wait_timeout_s: 2.0       # 상대 서버의 미기동 판단. 설계 출발값

