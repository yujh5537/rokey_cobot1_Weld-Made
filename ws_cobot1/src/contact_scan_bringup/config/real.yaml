# source:=robot_force 파라미터 (실기, 로봇 내장 힘 감지)
#
# - 단위: m · N · s (docs/contracts/units-frames.md). 좌표는 Base(base_link 가칭) 기준이다.
# - 아래 수치는 BRD 의 "설계 출발값"이다. 실측값이 아니다. 실기 튜닝 값은 이 파일을 PR 로 고친다
#   (브랜치 tune-MMDD-*, 커밋 'tune:'). 값을 바꾸면 옆에 날짜 · 조건 · 시험 기록(docs/test-reports/)을 적는다.
#   실기 PC 에만 남은 값은 없는 값이다(docs/conventions.md).
# - "계약 이름" 표시가 있는 파라미터는 SetConfig 가 이름으로 전파한다(ros-interfaces.md 6.4). 이름을 바꾸지 않는다.
# - over_force_n, drop_limit_m 은 여러 노드가 같은 값을 써야 한다(7.2). test/test_config.py 가 검사한다.
# - 최상위 키는 노드 이름이다. 다른 노드의 파라미터는 각 담당자가 자기 절에 추가한다.

contact_detector:
  ros__parameters:
    source: robot_force              # 'sim' | 'robot_force' (BRD 4.1.6)
    contact_threshold_n: 3.0         # 계약 이름. 접촉 임계 |F - F0|. 출발값 3~5 N 중 하한 (정의서 6.2 의 출발값은 4.0)
                                     #   하한을 고른 이유: KPI '검출 하중 5 N 이하'(BRD 9장)의 여유
                                     #   근거: PR #57 툴 등록 후 무접촉 외력 크기의 표준편차 최대 0.50 N (학민, 2026-09-19, 3자세 x 50샘플)
                                     #   하강 중 관성력은 미측정(T08 미실시). TR-01(T24)에서 확정한다
    edge_drop_m: 0.0005              # 계약 이름. 접촉 소실로 보는 z 급강하. 출발값 0.5 mm. T25 에서 확정
                                     #   0.5 mm 는 BRD 1.4 의 r = 3 mm 예시와 함께 나온 값이다. 실측 r = 0.225 mm 에서는
                                     #   팁이 모서리에 얹혀 내려가는 구간(하강량 <= r)을 넘는다. T25 에서 재검토한다
    debounce_n: 3                    # 계약 이름. 연속 N 회 유지되면 확정. 출발값 3
    over_force_n: 30.0               # 계약 이름. 과대 외력(원시 |F|). 출발값 30 N
    over_force_debounce_n: 1         # 과대 외력을 확정하는 연속 횟수. 1 = 한 샘플로 즉시. 안전 쪽으로 둔 출발값
                                     #   한 샘플 튐으로 거짓 정지가 나면 TR-01 기록을 근거로 올린다

    # --- 접촉 소실(EDGE): 누름이 확인된 뒤, 최근 구간의 z 추세선보다 edge_drop_m 넘게 내려가면 조건 성립 ---
    edge_arm_force_n: 1.5            # |F - F0| 가 이 값을 넘으면 "누르고 있다". 그 뒤부터 EDGE 를 판정한다. 설계 출발값
                                     #   아래쪽 근거: 실기 무접촉 30 s 의 |F - F0| 최대 0.447 N (2026-09-20, idle_30s.csv, 홈 자세 정지)
                                     #   위쪽 조건: robot_manager 의 slide_target_force_n(미정)보다 충분히 작아야 한다
    edge_trend_window_s: 0.5         # 추세선을 맞추는 최근 구간. 윗면 기울기 · 탐침의 느린 밀림을 흡수한다. 설계 출발값
    edge_trend_min_samples: 10       # 구간 안의 샘플이 이보다 적으면 판정하지 않는다 (실기 42.7 Hz 면 0.5 s 에 약 21 개)

    stale_age_ms: 100                # 샘플 최신성 한계(정의서 6.2 제안값). 넘게 묵은 샘플은 버리고, 간격이 넘으면 경고한다
                                     #   실기 실측 간격 최대 29 ms (2026-09-20 기록기 단독, idle_30s.csv). robot_manager 의 실기 주기는 미측정
                                     #   sim.yaml 은 Virtual 최대 97.7 ms(계약 6.3) 때문에 200 이다

    # --- tare (/contact/tare): 무접촉 · 정지 구간의 외력 평균을 기준값 F0 로 저장 ---
    tare_duration_s: 1.5             # 요청의 duration_s 가 0 일 때 쓰는 구간. BRD 4.1.3 의 1~2 s
    tare_min_samples: 30             # 구간 안의 유효 샘플이 이보다 적으면 TARE_TIMEOUT
    tare_max_std_n: 0.3              # |F - F0| 의 RMS 가 넘으면 TARE_UNSTABLE. 설계 출발값. 실기 정지 상태 실측 0.035 N (2026-09-20)
    tare_max_force_n: 6.0            # |F0| 가 넘으면 TOOL_REG_SUSPECT (BRD 4.1.5 툴 등록 점검). 병후 제안값 (PR #57 코멘트)
                                     #   실측 |F0|: 툴 등록 1.81 N (2026-09-20 홈 자세) · 2.1~2.9 N, 최대 3.7 N (2026-09-19 3자세)
                                     #             툴 미등록 11~12.5 N. 두 구간 사이가 벌어져 있어 6 N 으로 가른다
                                     #   낮게 잡으면 안 되는 이유: 탐침이 홀더 안으로 밀리는 중이면 |F0| 가 올라갈 수 있고(PR #80),
                                     #   TOOL_REG_SUSPECT 오탐이 나면 tare 가 실패해 스캔이 아예 시작되지 않는다

safety_monitor:
  ros__parameters:
    over_force_n: 30.0               # 계약 이름. contact_detector 와 같은 값
    drop_limit_m: 0.005              # 계약 이름. SLIDE 첫 샘플 z 기준 하강 제한. 출발값 5 mm
    confirm_n: 1                     # 조건을 확정하는 연속 샘플 수. 1 = 한 샘플로 즉시(안전 쪽)
    startup_grace_s: 3.0          # 기동 후 이 시간 동안은 최신성(샘플 · 상태)으로 정지 · 래치를 걸지 않는다
                                     #   근거: 2026-09-21 종단 실행에서 기동 직후 샘플이 508 ms 끊겼고,
                                     #   그때 robot_manager 는 '위치를 모르면 이동 중'이라 moving=true 였다(PR #72).
                                     #   두 보수적 기본값이 겹쳐 뜨자마자 래치가 걸렸다
                                     #   과대 외력 · 하강 제한은 유예하지 않는다
                                     #   이슈 #53(1차·2차 동시 래치) 결정 전까지 1 로 둔다. 2 이상으로 올리면
                                     #   값과 기준 z 는 계약 7.2 대로 1차와 같게 두면서 2차만 늦출 수 있다
    sample_stale_ms: 300             # /robot/sample 이 이 시간 넘게 없으면 이상. 정지를 요청하는 기준이므로
                                     #   contact_detector 의 stale_age_ms(샘플을 버리는 기준)보다 관대하게 둔다
                                     #   실기 실측 간격 최대 29 ms(2026-09-20 기록기 단독). robot_manager 의 실기 주기는 미측정
                                     #   5 mm/s 하강이면 이 시간에 1.5 mm 를 간다(drop_limit_m 5 mm 의 30 %)
    robot_status_timeout_ms: 500     # /robot/status 미수신. Virtual 실측 9.3~9.8 Hz(약 107 ms)의 약 5 배. 실기는 미측정

    # --- 정지 요청 (접수 ≠ 정지 완료. 완료는 /robot/status 의 connected && !moving 으로만 본다) ---
    stop_confirm_timeout_s: 0.6      # 이 안에 정지가 확인되지 않으면 사유를 올리고 다시 요청한다. 설계 출발값
                                     #   하한 근거: robot_manager 의 moving_window_s 0.3 + 상태 발행 간격 약 0.13
                                     #   + 서비스 왕복 = 약 0.45 s. T32(TR-08 실기 중지 검증)에서 확정한다
                                     #   BRD 9장 KPI '작업 중지 반응 1초 이내'보다 작아야 한다
    stop_retry_period_s: 2.0         # 확인되지 않을 때 다시 요청하는 간격. 느리게 둔다 — 드라이버가 응답하지 않는
                                     #   원인이 호출 과부하일 수 있다(docs/env/api-check-log.md). 세게 두드리면 더 나빠진다
    status_publish_period_s: 1.0     # /safety/status 주기 발행. 상태가 바뀌면 이 값과 무관하게 바로 발행한다
    check_period_s: 0.05             # 최신성 · 정지 확인 시간 초과를 보는 주기

robot_manager:
  ros__parameters:
    home_joint_deg: [-24.14, 17.03, 51.68, -0.18, 111.39, -204.84]   # OP_HOME 목적지(관절각 J1~J6, deg). 없으면 robot_manager 가 OP_HOME 을 거절한다
                                     #   units-frames.md 의 홈위치 관절각. 2026-09-19 학민이 실기에서 확정했다
                                     #   ⚠️ J6 이 -204.84 deg 다. 현재 자세에 따라 크게 도는 경로가 나올 수 있다(PR #66 학민 경고)
    home_speed_deg_s: 20.0           # 홈 복귀 관절 속도. 실기는 낮춘다
    drop_limit_m: 0.005              # 계약 이름. safety_monitor 와 같은 값
    slide_target_force_n: 3.0        # 계약 이름 [N]. 출발값이고 잠정이다.
                                     #   ⚠️ set_desired_force 를 DR_FC_MOD_REL 로 부른다. 드라이버
                                     #   정의가 "relative to initial state (the instance when this
                                     #   function is called)" 이므로, 이 값은 tare 대비가 아니라
                                     #   **호출 시점에 이미 실려 있는 힘에 더해지는 값**이다.
                                     #   SLIDE 는 DESCEND 가 접촉으로 끝난 직후에 오므로 기준선이
                                     #   접촉력(증분 3~5 N 추정)이고, 실제 누름은 그만큼 더 커진다.
                                     #   실기에서 SLIDE 시작 로그의 기준선 Fz 를 보고 정한다 (#73).
                                     #   ⚠️ edge_arm_force_n · contact_threshold_n 과 직접 비교하지
                                     #   않는다. 그 둘은 tare 대비 증분(|F − F0|)이고 이 값은 호출
                                     #   시점 기준이라, 기준이 다른 값끼리는 대소 비교가 성립하지
                                     #   않는다 (현지 리뷰, PR #73). 실제 누름을 tare 기준으로
                                     #   환산하려면 SLIDE 시작 로그의 기준선 Fz 를 더해야 한다.
                                     #   9/20 실기 편향 2.25 mm 는 tare 대비 증분 2~4 N 에서 잰 값이다(밀린 탐침이라 무효, units-frames.md v0.1.11).
                                     #   확정 순서: 이동 중 잡음 → 임계 → 누름 힘 → 편향 (병후)
    compliance_stiffness: [3000.0, 3000.0, 3000.0, 200.0, 200.0, 200.0]
                                     # task_compliance_ctrl 강성 [N/m ×3, N·m/rad ×3].
                                     #   두산 기본값. 실기에서 조정한다
    arrival_tolerance_m: 0.003       # OP_MOVE_TO 도착 판정 허용치 [m]. 멈춘 것과 도착한 것은
                                     #   다르다. 이 값을 넘으면 TARGET_REACHED 가 아니라
                                     #   ROBOT_ERROR 다. 출발값이고 실기에서 확정한다 (#73)
    arrival_grace_s: 1.0             # 명령 후 이 시간 안에 안 움직이면 도착으로 본다 [s]
    release_force_time_s: 0.3        # release_force 의 강성 제어 전환 시간 [s] (0~1.0).
                                     #   0 이면 즉시 전환이라 참조 외력이 점프한다
                                     #   (두산 매뉴얼 5.1.4 알아두기). 실기에서 확인한다
    frame_id: base_link              # units-frames.md 가칭. 계약에서 확정되면 같이 바꾼다
    dsr_namespace: dsr01
    sample_rate_hz: 50.0             # 설정값. 실측은 Virtual 37.6 Hz, 실기 42.8 Hz
    status_rate_hz: 10.0
    service_timeout_s: 0.5
    slow_call_warn_s: 0.15           # 이보다 늦은 두산 서비스 응답을 이름 · 시간과 함께 남긴다(#130). 0 이면 끈다.
                                     #   9/21 실기: 정지 중 · 모션 중 모두 약 3 s 주기로 한 호출이 330~365 ms 늦었다(평소 4~20 ms)
    moving_eps_m: 0.0002             # 이 창 안에서 이만큼 움직이면 이동 중.
                                     #   실기 posx 잡음이 0.2 mm 를 넘으면 영원히 '이동 중'이 되어
                                     #   정지 완료가 안 나오고, 너무 크면 느린 하강을 정지로 본다.
                                     #   실기에서 확인해 조정한다 (다음 세션 'moving 오탐 여부')
    moving_window_s: 0.3

scan_manager:
  ros__parameters:
    state_publish_period_s: 1.0      # /scan/state 주기 발행 간격(s). 상태가 바뀌면 이 값과 무관하게 바로 발행한다
                                     #   0 이하면 노드가 기동하지 않는다. 설계 출발값이며 실측값이 아니다 (병후, PR #50)
    # --- T19a (병후). 아래 수치는 설계 출발값이다. 실측값이 아니다(tip_radius_m 한 줄만 실측) ---
    # 필수 항목이 비어 있으면 노드는 기동하되 START 를 INVALID_VALUE 로 거절하고 빠진 이름을 알려 준다(코드 예비값 없음).
    # **TBD 로 남긴 항목을 채우기 전에는 실기에서 START 가 거절된다. 의도한 fail-safe 다.**
    # descend_speed_mps:             # 계약 이름. TBD (계약 9장). 하강 중 관성력 · 감속 거리로 정한다(T13 · T24)
    # slide_speed_mps:               # 계약 이름. TBD
    # max_descend_m:                 # 계약 이름. TBD. 조건은 units-frames.md '탐색 기준점 높이': 하한 = 기준점 → 부재 윗면 거리 + 여유,
                                     #   상한 < 기준점 팁 높이 - 안전 여유(넘으면 부재가 없을 때 작업대 면을 윗면으로 잡는다)
    # max_slide_m:                   # 계약 이름. TBD. 부재 크기 · 작업영역으로 정한다
    # motion_timeout_s:              # 계약 이름. TBD. **이 값이 없으면 START 뿐 아니라 안전복귀(/scan/home)도 거절된다**
                                     #   (OP_HOME 에 실을 제한 시간이다. 실기 세션 전에 가장 먼저 채운다)
    # --- 모션 (계약 이름). 실기는 sim 보다 보수적으로 둔다. 전부 설계 출발값이며 실측이 아니다 ---
    descend_speed_mps: 0.003         # OP_DESCEND 속도. 저속 등속(BRD 4.2.1: 가감속 관성력이 외력으로 읽히는 것을 피한다)
                                     #   느릴수록 판정 지연이 거리로 덜 환산된다. TR-01(T24)에서 조정
    slide_speed_mps: 0.005           # OP_SLIDE 속도. 편향은 속도에 비례하므로 sim(0.010)보다 낮춘다. T25 에서 조정
    max_descend_m: 0.120             # 미접촉 실패 한계. 근거(units-frames.md v0.1.11, TCP 252.12): 기준점(홈 팁) 높이 작업대 위 187.34 mm,
                                     #   80 mm 큐브 윗면까지 107.44 mm. 하한 0.113(접촉 실측 + 여유 5) < 0.120 < 상한 0.1823
                                     #   홈은 바꾸지 않으므로 이 값이 닿는 부재 높이를 정한다: 0.120 이면 높이 72.3 mm 이상
                                     #   ⚠️ 부재가 없으면 팁이 작업대까지 내려간다. 목표 z 제한이 유일한 보호다
    max_slide_m: 0.060               # 미소실 실패 한계. 80 mm 큐브 반폭 0.040 + 여유
    motion_timeout_s: 60.0           # 단위 모션 제한
    move_speed_mps: 0.030            # OP_MOVE_TO 속도(기준점 이동 · 방향 전환의 올림과 수평 이동 · 마무리 들어 올림)
    recontact_speed_mps: 0.002       # 방향 전환 뒤 내림 속도. 이동 속도가 아니라 저속이어야 한다(계약 7.3)
    lift_height_m: 0.05              # 계약 이름. 방향 전환 · 마무리 때 팁 상승량. 출발값 50 mm (BRD 4.2.6)
    # move_speed_mps:                # OP_MOVE_TO 속도. TBD. robot_manager 는 OP_HOME 이 아닌 goal 의 speed <= 0 을 거절한다(PR #73)
    recontact_margin_m: 0.001        # 방향 전환 뒤 내림 목표 = 첫 접촉 z + 이 값. 출발값 1 mm (계약 7.3). drop_limit_m 보다 충분히 작아야 한다
    # recontact_speed_mps:           # 방향 전환 뒤 내림 속도(저속). TBD (계약 9장)
    # --- 좌표 (units-frames.md v0.1.11 에서 값이 정해졌지만 **아직 켜지 않는다**. 없으면 scan_manager 가 START 를 INVALID_VALUE 로 거절한다) ---
    #   ⚠️ 켜는 조건은 둘이다.
    #   ① #109 해결. scan_manager 는 기준점에서 '정지 상태로' tare 하는데, 2026-09-21 실기에서 이 방식은
    #      하강 중 외력 치우침(약 2.3 N) 때문에 큐브 45 mm 위 허공에서 거짓 CONTACT 를 냈다(realrobot-session_20260921.md 5-2 · 5-11).
    #      거짓 접촉 뒤 허공에서 힘 제어 SLIDE 가 나가면 위험하다.
    #   ② 새 탐침 TCP x · y 를 툴 z축 180° 회전으로 확인. 지금 x · y (-1.30, 3.71) 는 옛 탐침 값이고,
    #      아래 두 값은 절대 좌표라 x · y 오차가 그대로 들어간다(units-frames.md 45행)
    # search_origin_pose: [0.42356, -0.18606, 0.28784, 0.9999791452, 0.0064576733, -0.0000833683, -0.0000257908]
                                     # 탐색 기준점 상공. Base, x y z qx qy qz qw. x · y = 작업대 원점(홈 바로 아래 고정 하강점),
                                     #   z = 홈 팁 높이(TCP 252.12), 자세 = 홈 자세(ZYZ 163.18, 179.99, -17.56 deg). 오일러로 두지 않는다
    # base_to_fixture: [0.42356, -0.18606, 0.100503]
                                     # 작업대 원점의 Base 좌표 x y z. 평행 이동만. z = 작업대 기준점 100.503 mm (units-frames.md v0.1.11)
                                     #   부재는 테이프선에 맞춰 놓고 본드로 고정한다(배치 원칙). 탐침 점검을 통과한 세션에서만 유효하다
    support_z_m: 0.0                 # 지지면 높이(작업대 좌표). z=0 이 작업대 표면이다(units-frames.md). 0 이 정당한 값이다
    detect_latency_s: 0.020          # 편향 보정 지연 t. **설계 출발값이며 실측이 아니다**
                                     #   구성: 샘플 주기의 절반(실기 42.7 Hz 면 약 12 ms) + 조회 왕복(get_tool_force 4~7 ms, PR #66)
                                     #        + 실제 접촉부터 힘이 임계에 닿기까지(금속이라 짧을 것으로 보지만 **미측정**)
                                     #   계약 v0.1.5 로 판정 샘플이 '조건이 처음 성립한 샘플'이 되어 디바운스 몫은 빠졌다
                                     #   sim.yaml 은 가상 강성 모델이 있어 근거가 다르다(그쪽 주석 참고)
                                     #   T24 에서 detect_stamp - force_stamp 로 실측해 바꾼다
    tip_radius_m: 0.000225           # 편향 보정 r. **반지름**이다(지름 0.45 mm). 실측: 2026-09-19 학민, 인공눈물 용기 끝(units-frames.md, PR #57)
    # detect_latency_s:              # 편향 보정 지연 t. TBD (T24 · T30 실측). '판정 샘플'의 정의(이슈 #69)에 따라 뜻이 달라진다
    edge_round_radius_m: 0.0         # 부재 모서리 둥글림 R. 기준 큐브(80 x 80 x 80 mm)는 모서리가 예리하다: 라운드 없음
                                     #   실측: 2026-09-20 학민, 캘리퍼 · 손끝(PR #80, docs/test-reports/T03-follow-up_20260920.md).
                                     #   2026-09-19 의 라운드 가설은 폐기됐다. 다른 부재를 쓰면 다시 잰다. 0 이 정당한 값이다
    edge_bias_offset_m: 0.0          # 실측 나머지 편향. **아직 재지 않아 0 이다.** T25 에서 누름 힘별로 재서 채운다.
                                     #   PR #80 의 2.25 mm 는 홀더 안으로 밀린 탐침으로 잰 값이라 무효다(units-frames.md v0.1.11). 새 탐침으로 다시 잰다
                                     #   스칼라 하나, 방향당 값((추정 폭 - 캘리퍼 폭) / 2). 검출점이 진행 방향으로 더 나간 거리가 + 이고,
                                     #   geometry_estimator 가 그만큼 진행 방향 반대로 뺀다(README, PR #75)
    result_dir: data                 # result_store 경로. 상대 경로는 노드를 띄운 셸의 현재 디렉터리 기준이다
                                     #   ws_cobot1 에서 launch 하면 ws_cobot1/data (gitignore). 실기 PC 에만 남은 기록은 없는 기록이다
    result_frame_id: workpiece_fixture    # ScanResult 의 프레임(가칭)
    motion_frame_id: base_link            # ExecuteMotion goal 의 프레임(가칭)
    direction_order: [POS_X, NEG_X, POS_Y, NEG_Y]   # 모서리 탐색 순서. 기동할 때만 읽는다
    event_wait_timeout_s: 1.0        # Result 가 가리킨 ContactEvent 를 기다리는 한도. 설계 출발값
    stop_confirm_timeout_s: 5.0      # 정지 완료(connected && !moving)를 기다리는 한도. 설계 출발값
    server_wait_timeout_s: 2.0       # 상대 서버의 미기동 판단. 설계 출발값

