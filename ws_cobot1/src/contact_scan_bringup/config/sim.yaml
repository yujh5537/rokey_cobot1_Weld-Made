# source:=sim 파라미터 (Virtual Mode + 가상 직육면체)
#
# - 단위: m · N · s (docs/contracts/units-frames.md). 좌표는 Base(base_link 가칭) 기준이다.
# - 아래 수치는 BRD 의 "설계 출발값"이거나 sim 전용 가상값이다. 실측값이 아니다.
# - "계약 이름" 표시가 있는 파라미터는 SetConfig 가 이름으로 전파한다(ros-interfaces.md 6.4). 이름을 바꾸지 않는다.
# - over_force_n, drop_limit_m 은 여러 노드가 같은 값을 써야 한다(7.2). test/test_config.py 가 검사한다.
# - 최상위 키는 노드 이름이다. 다른 노드의 파라미터는 각 담당자가 자기 절에 추가한다.

contact_detector:
  ros__parameters:
    source: sim                      # 'sim' | 'robot_force' (BRD 4.1.6)
    contact_threshold_n: 3.0         # 계약 이름. 접촉 임계 |F - F0|. 출발값 3~5 N 중 하한 (정의서 6.2 의 출발값은 4.0)
                                     #   하한을 고른 이유: KPI '검출 하중 5 N 이하'(BRD 9장)의 여유
                                     #   근거: PR #57 툴 등록 후 무접촉 외력 크기의 표준편차 최대 0.50 N (학민, 2026-09-19, 3자세 x 50샘플)
                                     #   하강 중 관성력은 미측정(T08 미실시). TR-01(T24)에서 확정한다
    edge_drop_m: 0.0005              # 계약 이름. 접촉 소실로 보는 z 급강하. 출발값 0.5 mm
                                     #   0.5 mm 는 BRD 1.4 의 r = 3 mm 예시와 함께 나온 값이다. 실측 r = 0.225 mm 에서는
                                     #   팁이 모서리에 얹혀 내려가는 구간(하강량 <= r)을 넘는다. T25 에서 재검토한다
    debounce_n: 3                    # 계약 이름. 연속 N 회 유지되면 확정. 출발값 3
    over_force_n: 30.0               # 계약 이름. 과대 외력(원시 |F|). 출발값 30 N
    over_force_debounce_n: 1         # 과대 외력을 확정하는 연속 횟수. 1 = 한 샘플로 즉시. 안전 쪽으로 둔 출발값
                                     #   한 샘플 튐으로 거짓 정지가 나면 TR-01 기록을 근거로 올린다

    # --- 접촉 소실(EDGE): 누름이 확인된 뒤, 최근 구간의 z 추세선보다 edge_drop_m 넘게 내려가면 조건 성립 ---
    edge_arm_force_n: 1.5            # |F - F0| 가 이 값을 넘으면 "누르고 있다". 그 뒤부터 EDGE 를 판정한다. 설계 출발값
                                     #   아래쪽 근거: 실기 무접촉 30 s 의 |F - F0| 최대 0.447 N (2026-09-20, idle_30s.csv, 홈 자세 정지)
                                     #   위쪽 조건: robot_manager 의 slide_target_force_n(미정)보다 충분히 작아야 한다
    edge_trend_window_s: 0.5         # 추세선을 맞추는 최근 구간. 윗면 기울기 · 탐침의 느린 밀림을 흡수한다. 설계 출발값
    edge_trend_min_samples: 10       # 구간 안의 샘플이 이보다 적으면 판정하지 않는다 (실기 42.7 Hz 면 0.5 s 에 약 21 개)

    stale_age_ms: 200                # 샘플 최신성 한계. 넘게 묵은 샘플은 버리고, 간격이 넘으면 경고한다
                                     #   sim 은 Virtual 에서 돈다. 계약 6.3 의 Virtual 실측 간격 최대 97.7 ms 의 2 배로 둔다.
                                     #   real 의 100 을 쓰면 샘플이 실제로 버려지고, 그만큼 추세선 점이 빠져
                                     #   edge_trend_min_samples 를 못 채워 EDGE 가 조용히 나오지 않는다
                                     #   대가: 간격 경고도 200 ms 기준이 되어 Virtual 의 97.7 ms 공백은 경고에 안 잡힌다.
                                     #   저녁 통합에서는 `ros2 topic hz /robot/sample --use-wall-clock` 으로 따로 본다

    # --- tare (/contact/tare): 무접촉 · 정지 구간의 외력 평균을 기준값 F0 로 저장 ---
    tare_duration_s: 1.5             # 요청의 duration_s 가 0 일 때 쓰는 구간. BRD 4.1.3 의 1~2 s
    tare_min_samples: 30             # 구간 안의 유효 샘플이 이보다 적으면 TARE_TIMEOUT
    tare_max_std_n: 0.3              # |F - F0| 의 RMS 가 넘으면 TARE_UNSTABLE. 설계 출발값. 실기 정지 상태 실측 0.035 N (2026-09-20)
    tare_max_force_n: 6.0            # |F0| 가 넘으면 TOOL_REG_SUSPECT (BRD 4.1.5 툴 등록 점검). 병후 제안값 (PR #57 코멘트)
                                     #   실측 |F0|: 툴 등록 1.81 N (2026-09-20 홈 자세) · 2.1~2.9 N, 최대 3.7 N (2026-09-19 3자세)
                                     #             툴 미등록 11~12.5 N. 두 구간 사이가 벌어져 있어 6 N 으로 가른다
                                     #   낮게 잡으면 안 되는 이유: 탐침이 홀더 안으로 밀리는 중이면 |F0| 가 올라갈 수 있고(PR #80),
                                     #   TOOL_REG_SUSPECT 오탐이 나면 tare 가 실패해 스캔이 아예 시작되지 않는다
    # --- 하강 · 밀기 기준 분리 (#109). 값의 근거는 real.yaml ---
    descend_ref_window_s: 1.0        # sim 도 같은 경로를 탄다. sim 외력은 무접촉이면 0 이라 이동 기준도 0 근처다
                                     #   느린 접촉 경계 약 4.6 N/s(real.yaml 주석, #139). sim 은 sim_stiffness_n_per_m × descend_speed_mps
    descend_ref_lag_s: 0.3
    descend_ref_min_samples: 10
    descend_ref_settle_s: 5.5
    descend_hold_threshold_n: 6.0
    edge_arm_still_window_s: 0.2     # z 로 EDGE 판정 켜기. sim 은 틈을 sim_fall_speed_mps 로 메운 뒤 윗면을 따라간다
    edge_arm_still_m: 0.0001
    edge_arm_travel_m: 0.0005
    edge_force_drop_n: 0.0           # 힘 꺾임 EDGE (#128) 끔. 나머지는 real.yaml 과 같다
    edge_force_window_s: 0.5
    edge_force_lag_s: 0.1
    edge_force_settle_s: 1.5

    # --- sim 입력원 전용: 가상 직육면체 (T07). 실제 부재와 무관한 가상값. 이름은 정의서 6.2 ---
    sim_box_frame_id: base_link            # 아래 좌표의 프레임. RobotSample.frame_id 와 다르면 sim 은 판정하지 않는다
    sim_box_origin_m: [0.425, -0.184, 0.400]   # 밑면 중심(지지면 위)의 x, y, z. 홈 자세 바로 아래에 둔다
                                           #   Virtual 기본 자세(관절 전부 0)는 특이점이라 move_line 의 역기구학 해가 없다.
                                           #   서비스는 success=true 를 주고도 움직이지 않는다(2026-09-21 확인).
                                           #   홈 관절각으로 간 뒤에는 정상이므로 박스도 그 근처에 둔다
    sim_box_size_m: [0.10, 0.06, 0.04]     # 가로(x) · 세로(y) · 높이(z). 윗면 z = origin z + 높이
    sim_stiffness_n_per_m: 20000.0         # 가상 외력 = 강성 x 윗면 침투 깊이. 3 N 에서 침투 0.15 mm, 30 N 에서 1.5 mm
    sim_tip_radius_m: 0.000225             # 가상 팁 반지름. PR #57 실측 r = 0.225 mm (지름 0.45 mm) 와 같게 둔다
                                           #   units-frames.md v0.1.2. edge_drop_m(0.5 mm) > r 이라 실기와 같은 보정 경로(δ >= r)를 sim 에서 본다
                                           #   scan_manager 의 tip_radius_m 과 같은 값이어야 sim 치수가 복원된다
    sim_fall_speed_mps: 0.050              # 모서리에서 표면이 사라졌을 때 팁이 따라 내려가는 속도 제한
                                           #   순응 제어의 추종 속도에 해당한다. Virtual 에서는 힘 제어가 안 되므로 sim 이 만든다
    sim_slide_press_n: 3.0                 # OP_SLIDE 중 유지하는 누름 힘. edge_arm_force_n(1.5)보다 커야 EDGE 판정이 켜진다
                                           #   robot_manager 의 slide_target_force_n 에 해당. 실기 값은 아직 미정이다
    # 주의: sim 박스는 모서리가 예리하다. 실제 블록의 모서리 라운드 · 모따기는 재현되지 않는다.
    #   'sim 에서 치수가 복원된다'는 편향 보정 코드가 맞다는 뜻일 뿐, 실기 치수 정확도의 근거가 아니다.
    #   실기 정확도는 TR-02(T31)에서만 판정한다.

safety_monitor:
  ros__parameters:
    over_force_n: 30.0               # 계약 이름. contact_detector 와 같은 값
    drop_limit_m: 0.005              # 계약 이름. SLIDE 첫 샘플 z 기준 하강 제한. 출발값 5 mm
    confirm_n: 1                     # 조건을 확정하는 연속 샘플 수. 1 = 한 샘플로 즉시(안전 쪽)
    startup_grace_s: 3.0          # 기동 후 이 시간 동안은 최신성(샘플 · 상태)으로 정지 · 래치를 걸지 않는다
                                     #   근거: 2026-09-21 종단 실행에서 기동 직후 샘플이 508 ms 끊겼고,
                                     #   그때 robot_manager 는 '위치를 모르면 이동 중'이라 moving=true 였다(PR #72).
                                     #   두 보수적 기본값이 겹쳐 뜨자마자 래치가 걸렸다
                                     #   과대 외력 · 하강 제한은 유예하지 않는다
                                     #   이슈 #53(1차·2차 동시 래치) 결정 전까지 1 로 둔다. 2 이상으로 올리면
                                     #   값과 기준 z 는 계약 7.2 대로 1차와 같게 두면서 2차만 늦출 수 있다
    sample_stale_ms: 500             # /robot/sample 이 이 시간 넘게 없으면 이상. sim 은 Virtual 에서 돈다
                                     #   Virtual 실측 간격 최대 97.7 ms(계약 6.3)의 5 배
    robot_status_timeout_ms: 1000    # /robot/status 미수신. Virtual 실측 9.3~9.8 Hz(약 107 ms)의 약 9 배

    # --- 정지 요청 (접수 ≠ 정지 완료. 완료는 /robot/status 의 connected && !moving 으로만 본다) ---
    stop_confirm_timeout_s: 0.6      # 이 안에 정지가 확인되지 않으면 사유를 올리고 다시 요청한다. 설계 출발값
                                     #   하한 근거: robot_manager 의 moving_window_s 0.3 + 상태 발행 간격 약 0.13
                                     #   + 서비스 왕복 = 약 0.45 s. T32(TR-08 실기 중지 검증)에서 확정한다
                                     #   BRD 9장 KPI '작업 중지 반응 1초 이내'보다 작아야 한다
    stop_retry_period_s: 2.0         # 확인되지 않을 때 다시 요청하는 간격. 느리게 둔다 — 드라이버가 응답하지 않는
                                     #   원인이 호출 과부하일 수 있다(docs/env/api-check-log.md). 세게 두드리면 더 나빠진다
    status_publish_period_s: 1.0     # /safety/status 주기 발행. 상태가 바뀌면 이 값과 무관하게 바로 발행한다
    check_period_s: 0.05             # 최신성 · 정지 확인 시간 초과를 보는 주기

robot_manager:
  ros__parameters:
    home_joint_deg: [-24.14, 17.03, 51.68, -0.18, 111.39, -204.84]   # OP_HOME 목적지(관절각 J1~J6, deg). 없으면 robot_manager 가 OP_HOME 을 거절한다
                                     #   units-frames.md 의 홈위치 관절각(2026-09-19 학민 실기 확정)을 그대로 쓴다.
                                     #   sim 도 같은 값을 쓰는 이유: Virtual 기본 자세(관절 전부 0)는 특이점이라
                                     #   직선 이동(move_line)의 역기구학 해가 없다. 이 자세로 먼저 가야 OP_MOVE_TO 가 동작한다
    home_speed_deg_s: 30.0           # 홈 복귀 관절 속도
    drop_limit_m: 0.005              # 계약 이름. safety_monitor 와 같은 값
    slide_target_force_n: 3.0        # 계약 이름 [N]. 출발값이고 잠정이다.
                                     #   ⚠️ set_desired_force 를 DR_FC_MOD_REL 로 부른다. 드라이버
                                     #   정의가 "relative to initial state (the instance when this
                                     #   function is called)" 이므로, 이 값은 tare 대비가 아니라
                                     #   **호출 시점에 이미 실려 있는 힘에 더해지는 값**이다.
                                     #   SLIDE 는 DESCEND 가 접촉으로 끝난 직후에 오므로 기준선이
                                     #   접촉력(증분 3~5 N 추정)이고, 실제 누름은 그만큼 더 커진다.
                                     #   실기에서 SLIDE 시작 로그의 기준선 Fz 를 보고 정한다 (#73).
                                     #   ⚠️ edge_arm_force_n · contact_threshold_n 과 직접 비교하지
                                     #   않는다. 그 둘은 tare 대비 증분(|F − F0|)이고 이 값은 호출
                                     #   시점 기준이라, 기준이 다른 값끼리는 대소 비교가 성립하지
                                     #   않는다 (현지 리뷰, PR #73). 실제 누름을 tare 기준으로
                                     #   환산하려면 SLIDE 시작 로그의 기준선 Fz 를 더해야 한다.
                                     #   9/20 실기 편향 2.25 mm 는 tare 대비 증분 2~4 N 에서 잰 값이다.
                                     #   확정 순서: 이동 중 잡음 → 임계 → 누름 힘 → 편향 (병후)
    compliance_stiffness: [3000.0, 3000.0, 3000.0, 200.0, 200.0, 200.0]
                                     # task_compliance_ctrl 강성 [N/m ×3, N·m/rad ×3].
                                     #   두산 기본값. 실기에서 조정한다
    arrival_tolerance_m: 0.003       # OP_MOVE_TO 도착 판정 허용치 [m]. 멈춘 것과 도착한 것은
                                     #   다르다. 이 값을 넘으면 TARGET_REACHED 가 아니라
                                     #   ROBOT_ERROR 다. 출발값이고 실기에서 확정한다 (#73)
    arrival_grace_s: 1.0             # 명령 후 이 시간 안에 안 움직이면 도착으로 본다 [s]
    move_restart_max: 1              # 이동 명령이 arrival_grace_s 안에 출발하지 않으면 move_stop 뒤 같은 명령을 다시 보내는 최대 횟수.
                                     #   0 이면 끈다. SLIDE 와 MOVE_TO 에 쓴다(MOVE_TO 는 아직 도착 허용치 밖일 때만).
                                     #   9/22 실기: 힘 제어를 켠 뒤 보낸 amovel 을 드라이버가 32 회 중 8 회 실행하지 않았다(#153).
                                     #   9/23 실기 12:52: 모서리 뒤 올림(50 mm)이 86 ms 만에 끝나고 한 걸음도 가지 않아 통합 스캔이 중단됐다
    release_force_time_s: 0.3        # release_force 의 강성 제어 전환 시간 [s] (0~1.0).
                                     #   0 이면 즉시 전환이라 참조 외력이 점프한다
                                     #   (두산 매뉴얼 5.1.4 알아두기). 실기에서 확인한다
    frame_id: base_link              # units-frames.md 가칭. 계약에서 확정되면 같이 바꾼다
    dsr_namespace: dsr01
    sample_rate_hz: 50.0             # 설정값. 실측은 Virtual 37.6 Hz, 실기 42.8 Hz
    status_rate_hz: 10.0
    service_timeout_s: 0.5
    slow_call_warn_s: 0.15           # 이보다 늦은 두산 서비스 응답을 이름 · 시간과 함께 남긴다(#130). 0 이면 끈다
    moving_eps_m: 0.0002             # 이 창 안에서 이만큼 움직이면 이동 중
    moving_window_s: 0.3
    moved_min_m: 0.001               # 동작 방향으로 이만큼 넘게 가야 "움직였다"(도착 판정용) [m]. SLIDE 는 x · y 만 본다.
                                     #   힘 제어를 켤 때 z 0.3~0.5 mm 움직임을 출발로 보지 않는다(9/22 실기 1083)
    slide_mode: force                # sim 은 힘 제어 밀기를 유지한다. Virtual 의 외력은 0 근처라 스텝 모드(멈춰서 힘 읽기)를
                                     #   돌릴 수 없다. 스텝 모드는 순수 모듈 시험(test_step_slide.py)과 실기로 검증한다 (real.yaml)
    # --- ExecutePath (phase 2, docs/phase2/weld-ros-interfaces.md 5.2 · 6장, D31) ---------------------
    # 없거나 못 쓰는 값이면 robot_manager 는 기동하고 ExecutePath 만 거절한다(코드에 기본값 없음)
    path_mode: line                  # line = 점마다 amovel 뒤 멈춤 확인(1차에서 실기 확인된 API만). 점마다 선다(D8 허용).
                                     #   spline = 첫 점까지 amovel 직선 뒤 나머지를 amovesx 한 번. 호출 확인(P1-3 Virtual ·
                                     #   #186 M4) 전이라 기본으로 두지 않는다
    path_max_points: 100             # 경유점 상한. spline 은 드라이버 고정 배열 100 을 넘을 수 없다(컨트롤러가 개수를 검사하지 않는다)
    path_max_speed_mps: 0.100        # 경로 속도 상한 [m/s]. 계약 출발값. weld_manager 는 상한을 보지 않는다(D29)
    path_min_z_m: 0.403              # Base z 하한 [m]. 경유점이 잘못 와도 작업대에 박히지 않게 하는 마지막 울타리.
                                     #   sim 박스 밑면(지지면) z 0.400 + 여유 3 mm. weld_manager 의 세로선 끝은 지지면 + 5 mm
    path_acc_ratio: 4.0              # 가속 = 이 값 × 속도 [1/s]. 1차 move_line 의 4 배 규칙과 같다

scan_manager:
  ros__parameters:
    state_publish_period_s: 1.0      # /scan/state 주기 발행 간격(s). 상태가 바뀌면 이 값과 무관하게 바로 발행한다
                                     #   0 이하면 노드가 기동하지 않는다. 설계 출발값이며 실측값이 아니다 (병후, PR #50)
    # --- T19a (병후). 아래는 sim 전용 가상값이거나 설계 출발값이다. 실측값이 아니다(tip_radius_m 한 줄만 실측) ---
    # 필수 항목이 비어 있으면 노드는 기동하되 START 를 INVALID_VALUE 로 거절하고 빠진 이름을 알려 준다(코드 예비값 없음).
    descend_speed_mps: 0.005         # 계약 이름. OP_DESCEND 속도
    slide_speed_mps: 0.010           # 계약 이름. OP_SLIDE 속도
    max_descend_m: 0.080             # 계약 이름. 미접촉 실패 한계. 기준점 z 0.500 - 박스 윗면 0.440 = 0.060 에 여유
                                     #   기준점에서 지지면(0.400)까지의 0.100 보다 작아야 한다(scan_manager 가 검증한다)
    max_slide_m: 0.080               # 계약 이름. 미소실 실패 한계. 박스 반폭 0.050 에 여유
    motion_timeout_s: 30.0           # 계약 이름. 단위 모션 제한 시간
    lift_height_m: 0.05              # 계약 이름. 방향 전환 · 마무리 때 팁 상승량. 출발값 50 mm (BRD 4.2.6)
    move_speed_mps: 0.05             # OP_MOVE_TO 속도: 기준점 이동 · 방향 전환의 올림과 수평 이동 · 마무리 들어 올림
                                     #   robot_manager 는 OP_HOME 이 아닌 goal 의 speed <= 0 을 거절한다(PR #73)
    recontact_margin_m: 0.001        # 방향 전환 뒤 내림 목표 = 첫 접촉 z + 이 값. 출발값 1 mm (계약 7.3)
                                     #   drop_limit_m(0.005) 보다 충분히 작아야 한다: 틈을 메우는 하강도 하강 제한에 들어간다
    recontact_speed_mps: 0.005       # 방향 전환 뒤 내림 속도(저속)
    search_origin_pose: [0.425, -0.184, 0.500, 0.9999832196, 0.0055369752, -0.0014006997, 0.0009697282]
                                     # 탐색 기준점 상공. Base, x y z qx qy qz qw. sim 박스 중심의 위 0.10 m
                                     #   자세는 팁이 아래를 보는 수직(두산 ZYZ (0, 180, 0) deg 에 해당). 오일러로 두지 않는다(ZYZ 규약 혼동)
                                     #   Virtual Mode 에서 이 pose 에 도달하는지는 미확인이다(T19b)
    base_to_fixture: [0.425, -0.184, 0.400]   # 작업대 원점의 Base 좌표 x y z. 평행 이동만. sim 은 박스 밑면 중심과 같게 둔다
    support_z_m: 0.0                 # 지지면 높이(작업대 좌표). z=0 이 작업대 표면이다. 0 이 정당한 값이다
    tip_radius_m: 0.000225           # 편향 보정 r. **반지름**이다(지름 0.45 mm). units-frames.md 실측(2026-09-19 학민, PR #57)
                                     #   contact_detector 의 sim_tip_radius_m 과 같아야 sim 치수가 복원된다. 정의서 기본값 0.003 을 쓰지 않는다
    detect_latency_s: 0.020          # 편향 보정 지연 t. **sim 전용 계산값이며 실측이 아니다**
                                     #   (계약 v0.1.5 = PR #79 로 판정 샘플이 '조건이 처음 성립한 샘플'이 되어 디바운스 몫은 빠졌다)
                                     #
                                     #   ⚠️ 하나의 t 를 모서리(x · y)와 윗면(z)에 같이 쓰는데, 두 지연이 물리적으로 다르다:
                                     #     EDGE   : 팁이 모서리를 벗어난 뒤 z 가 edge_drop_m 을 넘는 첫 샘플까지
                                     #              = 낙하 1 샘플(sim_fall_speed 50 mm/s, 주기 20 ms 면 1 샘플에 1 mm) = 20 ms
                                     #     CONTACT: 침투가 임계에 닿을 때까지 = 3.0 N / 20000 N/m / 5 mm/s + 샘플링 = 40 ms
                                     #   **모서리 쪽에 맞춘다.** BRD 1.4 의 t 는 모서리 보정 문맥이고, 치수(가로 · 세로)를 정하는 것도 모서리다
                                     #   대가: z_top 이 계산상 0.10 mm 낮게 나온다(±3 mm 예산의 3 %). t = 0.040 이면 반대로 폭이 0.40 mm 커진다
                                     #   이 값은 sim_fall_speed_mps · slide_speed_mps · edge_drop_m 에 묶여 있다.
                                     #   바꾸면 다시 계산한다(test_sim_source.py::test_full_scan_recovers_the_virtual_box 가 치수로 검증한다)
    edge_round_radius_m: 0.0         # 부재 모서리 둥글림 R. sim 박스는 예리하다. 0 이 정당한 값이다
    edge_bias_offset_m: 0.0          # 실측 나머지 편향. 스칼라 하나, 방향당 값, 진행 방향 + (geometry_estimator README, PR #75)
    result_dir: ~/scan_results/sim   # result_store 경로. **절대경로로 둔다**(#187): 상대 경로는 노드를 띄운 셸의
                                     #   현재 디렉터리 기준이라 9/23 실기에서 ~/data 와 ws_cobot1/data 로 갈렸다.
                                     #   sim 과 real 을 나눈다 — weld_tracer 가 '가장 최근 결과'를 고르므로
                                     #   섞이면 실기 좌표를 sim 이 따라갈 수 있다(현지).
                                     #   scan_manager 가 expanduser 하므로 ~ 를 쓸 수 있다. test_config 가 검사한다
    result_frame_id: workpiece_fixture    # ScanResult 의 프레임(가칭)
    motion_frame_id: base_link            # ExecuteMotion goal 의 프레임(가칭)
    direction_order: [POS_X, NEG_X, POS_Y, NEG_Y]   # 모서리 탐색 순서. 기동할 때만 읽는다
    event_wait_timeout_s: 1.0        # Result 가 가리킨 ContactEvent 를 기다리는 한도. 넘으면 실패(TIMEOUT)
    stop_confirm_timeout_s: 5.0      # 정지 완료(connected && !moving)를 기다리는 한도. 넘으면 실패(ROBOT_STATUS_LOST)
    server_wait_timeout_s: 2.0       # 상대 서버(/robot/execute_motion · /contact/tare)의 미기동 판단
    # --- 상태 토픽이 끊긴 것을 보는 한도 (이슈 #120, 병후). 설계 출발값이며 실측값이 아니다 ---
    # /safety/status · /robot/status 는 TRANSIENT_LOCAL 이라 발행자가 죽어도 마지막 메시지가 남는다.
    # 마지막 stamp 가 이 값보다 오래되면 "끊김"으로 보고 START · 재시작을 거절한다(안전복귀는 /safety/status 를 보지 않는다).
    # 너무 짧게 잡으면 발행이 잠깐 늦은 것만으로 부당 거절이 난다. 발행 주기의 여러 배로 둔다.
    safety_status_timeout_s: 5.0     # safety_monitor.status_publish_period_s(1.0) 의 5 배
    robot_status_timeout_s: 2.0      # robot_manager.status_rate_hz(10 Hz = 0.1 s) 의 20 배.
                                     #   정지 중 300~360 ms 의 샘플 공백이 보고돼 있다(이슈 #130) — 그 5 배 이상으로 둔다

