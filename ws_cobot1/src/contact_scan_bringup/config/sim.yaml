# source:=sim 파라미터 (Virtual Mode + 가상 직육면체)
#
# - 단위: m · N · s (docs/contracts/units-frames.md). 좌표는 Base(base_link 가칭) 기준이다.
# - 아래 수치는 BRD 의 "설계 출발값"이거나 sim 전용 가상값이다. 실측값이 아니다.
# - "계약 이름" 표시가 있는 파라미터는 SetConfig 가 이름으로 전파한다(ros-interfaces.md 6.4). 이름을 바꾸지 않는다.
# - over_force_n, drop_limit_m 은 여러 노드가 같은 값을 써야 한다(7.2). test/test_config.py 가 검사한다.
# - 최상위 키는 노드 이름이다. 다른 노드의 파라미터는 각 담당자가 자기 절에 추가한다.

contact_detector:
  ros__parameters:
    source: sim                      # 'sim' | 'robot_force' (BRD 4.1.6)
    contact_threshold_n: 3.0         # 계약 이름. 접촉 임계 |F - F0|. 출발값 3~5 N 중 하한 (정의서 6.2 의 출발값은 4.0)
                                     #   하한을 고른 이유: KPI '검출 하중 5 N 이하'(BRD 9장)의 여유
                                     #   근거: PR #57 툴 등록 후 무접촉 외력 크기의 표준편차 최대 0.50 N (학민, 2026-09-19, 3자세 x 50샘플)
                                     #   하강 중 관성력은 미측정(T08 미실시). TR-01(T24)에서 확정한다
    edge_drop_m: 0.0005              # 계약 이름. 접촉 소실로 보는 z 급강하. 출발값 0.5 mm
                                     #   0.5 mm 는 BRD 1.4 의 r = 3 mm 예시와 함께 나온 값이다. 실측 r = 0.225 mm 에서는
                                     #   팁이 모서리에 얹혀 내려가는 구간(하강량 <= r)을 넘는다. T25 에서 재검토한다
    debounce_n: 3                    # 계약 이름. 연속 N 회 유지되면 확정. 출발값 3
    over_force_n: 30.0               # 계약 이름. 과대 외력(원시 |F|). 출발값 30 N
    over_force_debounce_n: 1         # 과대 외력을 확정하는 연속 횟수. 1 = 한 샘플로 즉시. 안전 쪽으로 둔 출발값
                                     #   한 샘플 튐으로 거짓 정지가 나면 TR-01 기록을 근거로 올린다

    # --- 접촉 소실(EDGE): 누름이 확인된 뒤, 최근 구간의 z 추세선보다 edge_drop_m 넘게 내려가면 조건 성립 ---
    edge_arm_force_n: 1.5            # |F - F0| 가 이 값을 넘으면 "누르고 있다". 그 뒤부터 EDGE 를 판정한다. 설계 출발값
                                     #   아래쪽 근거: 실기 무접촉 30 s 의 |F - F0| 최대 0.447 N (2026-09-20, idle_30s.csv, 홈 자세 정지)
                                     #   위쪽 조건: robot_manager 의 slide_target_force_n(미정)보다 충분히 작아야 한다
    edge_trend_window_s: 0.5         # 추세선을 맞추는 최근 구간. 윗면 기울기 · 탐침의 느린 밀림을 흡수한다. 설계 출발값
    edge_trend_min_samples: 10       # 구간 안의 샘플이 이보다 적으면 판정하지 않는다 (실기 42.7 Hz 면 0.5 s 에 약 21 개)

    stale_age_ms: 200                # 샘플 최신성 한계. 넘게 묵은 샘플은 버리고, 간격이 넘으면 경고한다
                                     #   sim 은 Virtual 에서 돈다. 계약 6.3 의 Virtual 실측 간격 최대 97.7 ms 의 2 배로 둔다.
                                     #   real 의 100 을 쓰면 샘플이 실제로 버려지고, 그만큼 추세선 점이 빠져
                                     #   edge_trend_min_samples 를 못 채워 EDGE 가 조용히 나오지 않는다
                                     #   대가: 간격 경고도 200 ms 기준이 되어 Virtual 의 97.7 ms 공백은 경고에 안 잡힌다.
                                     #   저녁 통합에서는 `ros2 topic hz /robot/sample --use-wall-clock` 으로 따로 본다

    # --- tare (/contact/tare): 무접촉 · 정지 구간의 외력 평균을 기준값 F0 로 저장 ---
    tare_duration_s: 1.5             # 요청의 duration_s 가 0 일 때 쓰는 구간. BRD 4.1.3 의 1~2 s
    tare_min_samples: 30             # 구간 안의 유효 샘플이 이보다 적으면 TARE_TIMEOUT
    tare_max_std_n: 0.3              # |F - F0| 의 RMS 가 넘으면 TARE_UNSTABLE. 설계 출발값. 실기 정지 상태 실측 0.035 N (2026-09-20)
    tare_max_force_n: 6.0            # |F0| 가 넘으면 TOOL_REG_SUSPECT (BRD 4.1.5 툴 등록 점검). 병후 제안값 (PR #57 코멘트)
                                     #   실측 |F0|: 툴 등록 1.81 N (2026-09-20 홈 자세) · 2.1~2.9 N, 최대 3.7 N (2026-09-19 3자세)
                                     #             툴 미등록 11~12.5 N. 두 구간 사이가 벌어져 있어 6 N 으로 가른다
                                     #   낮게 잡으면 안 되는 이유: 탐침이 홀더 안으로 밀리는 중이면 |F0| 가 올라갈 수 있고(PR #80),
                                     #   TOOL_REG_SUSPECT 오탐이 나면 tare 가 실패해 스캔이 아예 시작되지 않는다

    # --- sim 입력원 전용: 가상 직육면체 (T07). 실제 부재와 무관한 가상값. 이름은 정의서 6.2 ---
    sim_box_frame_id: base_link            # 아래 좌표의 프레임. RobotSample.frame_id 와 다르면 sim 은 판정하지 않는다
    sim_box_origin_m: [0.40, 0.00, 0.00]   # 밑면 중심(지지면 위)의 x, y, z
    sim_box_size_m: [0.10, 0.06, 0.04]     # 가로(x) · 세로(y) · 높이(z). 윗면 z = origin z + 높이
    sim_stiffness_n_per_m: 20000.0         # 가상 외력 = 강성 x 윗면 침투 깊이. 3 N 에서 침투 0.15 mm, 30 N 에서 1.5 mm
    sim_tip_radius_m: 0.000225             # 가상 팁 반지름. PR #57 실측 r = 0.225 mm (지름 0.45 mm) 와 같게 둔다
                                           #   units-frames.md v0.1.2. edge_drop_m(0.5 mm) > r 이라 실기와 같은 보정 경로(δ >= r)를 sim 에서 본다
                                           #   scan_manager 의 tip_radius_m 과 같은 값이어야 sim 치수가 복원된다
    # sim 엣지 모델(모서리를 지난 뒤의 가상 하강)의 나머지 파라미터는 T07 에서 확정한다
    # 주의: sim 박스는 모서리가 예리하다. 실제 블록의 모서리 라운드 · 모따기는 재현되지 않는다.
    #   'sim 에서 치수가 복원된다'는 편향 보정 코드가 맞다는 뜻일 뿐, 실기 치수 정확도의 근거가 아니다.
    #   실기 정확도는 TR-02(T31)에서만 판정한다.

safety_monitor:
  ros__parameters:
    over_force_n: 30.0               # 계약 이름. contact_detector 와 같은 값
    drop_limit_m: 0.005              # 계약 이름. SLIDE 첫 샘플 z 기준 하강 제한. 출발값 5 mm

robot_manager:
  ros__parameters:
    drop_limit_m: 0.005              # 계약 이름. safety_monitor 와 같은 값
    # slide_target_force_n:          # 계약 이름. 값 TBD (학민)
    frame_id: base_link              # units-frames.md 가칭. 계약에서 확정되면 같이 바꾼다
    dsr_namespace: dsr01
    sample_rate_hz: 50.0             # 설정값. 실측은 Virtual 37.6 Hz, 실기 42.8 Hz
    status_rate_hz: 10.0
    service_timeout_s: 0.5
    moving_eps_m: 0.0002             # 이 창 안에서 이만큼 움직이면 이동 중
    moving_window_s: 0.3

scan_manager:
  ros__parameters:
    state_publish_period_s: 1.0      # /scan/state 주기 발행 간격(s). 상태가 바뀌면 이 값과 무관하게 바로 발행한다
                                     #   0 이하면 노드가 기동하지 않는다. 설계 출발값이며 실측값이 아니다 (병후, PR #50)
    # --- T19a (병후). 아래는 sim 전용 가상값이거나 설계 출발값이다. 실측값이 아니다(tip_radius_m 한 줄만 실측) ---
    # 필수 항목이 비어 있으면 노드는 기동하되 START 를 INVALID_VALUE 로 거절하고 빠진 이름을 알려 준다(코드 예비값 없음).
    descend_speed_mps: 0.005         # 계약 이름. OP_DESCEND 속도
    slide_speed_mps: 0.010           # 계약 이름. OP_SLIDE 속도
    max_descend_m: 0.08              # 계약 이름. 미접촉 실패 한계. 기준점 z 0.10 - sim 박스 윗면 0.04 = 0.06 을 덮는다
    max_slide_m: 0.15                # 계약 이름. 미소실 실패 한계. sim 박스 중심에서 모서리까지 0.05 · 0.03 을 덮는다
    motion_timeout_s: 30.0           # 계약 이름. 단위 모션 제한 시간
    lift_height_m: 0.05              # 계약 이름. 방향 전환 · 마무리 때 팁 상승량. 출발값 50 mm (BRD 4.2.6)
    move_speed_mps: 0.05             # OP_MOVE_TO 속도: 기준점 이동 · 방향 전환의 올림과 수평 이동 · 마무리 들어 올림
                                     #   robot_manager 는 OP_HOME 이 아닌 goal 의 speed <= 0 을 거절한다(PR #73)
    recontact_margin_m: 0.001        # 방향 전환 뒤 내림 목표 = 첫 접촉 z + 이 값. 출발값 1 mm (계약 7.3)
                                     #   drop_limit_m(0.005) 보다 충분히 작아야 한다: 틈을 메우는 하강도 하강 제한에 들어간다
    recontact_speed_mps: 0.005       # 방향 전환 뒤 내림 속도(저속)
    search_origin_pose: [0.40, 0.00, 0.10, 0.0, 1.0, 0.0, 0.0]
                                     # 탐색 기준점 상공. Base, x y z qx qy qz qw. sim 박스 중심의 위 0.10 m
                                     #   자세는 팁이 아래를 보는 수직(두산 ZYZ (0, 180, 0) deg 에 해당). 오일러로 두지 않는다(ZYZ 규약 혼동)
                                     #   Virtual Mode 에서 이 pose 에 도달하는지는 미확인이다(T19b)
    base_to_fixture: [0.40, 0.00, 0.00]   # 작업대 원점의 Base 좌표 x y z. 평행 이동만. sim 박스의 밑면 중심과 같게 둔 가상값
    support_z_m: 0.0                 # 지지면 높이(작업대 좌표). z=0 이 작업대 표면이다. 0 이 정당한 값이다
    tip_radius_m: 0.000225           # 편향 보정 r. **반지름**이다(지름 0.45 mm). units-frames.md 실측(2026-09-19 학민, PR #57)
                                     #   contact_detector 의 sim_tip_radius_m 과 같아야 sim 치수가 복원된다. 정의서 기본값 0.003 을 쓰지 않는다
    # detect_latency_s:              # 편향 보정 지연 t. **TBD**: '판정 샘플'의 정의(이슈 #69, 계약 PR #79)가 머지된 뒤에 정한다
                                     #   현지 계산(2026-09-20, PR #77 코멘트. 실측값이 아니라 계산값):
                                     #     판정 좌표가 '확정된 샘플'의 것이면 (debounce_n 3 - 1) x 샘플 주기 0.020 s(50 Hz 목표) = 0.040
                                     #     판정 좌표가 '조건이 처음 성립한 샘플'의 것(PR #79 의 안)이면 디바운스 몫이 빠져 0 에 가깝다
                                     #   sim 입력원(T16)이 실제로 어떻게 찍는지와 맞춰야 한다. 0 을 임시로 넣지 않는다
                                     #   이 값이 없으면 sim 에서도 START 가 거절된다
    edge_round_radius_m: 0.0         # 부재 모서리 둥글림 R. sim 박스는 예리하다. 0 이 정당한 값이다
    edge_bias_offset_m: 0.0          # 실측 나머지 편향. 스칼라 하나, 방향당 값, 진행 방향 + (geometry_estimator README, PR #75)
    result_dir: data                 # result_store 경로. 상대 경로는 노드를 띄운 셸의 현재 디렉터리 기준이다
                                     #   ws_cobot1 에서 launch 하면 ws_cobot1/data (gitignore)
    result_frame_id: workpiece_fixture    # ScanResult 의 프레임(가칭)
    motion_frame_id: base_link            # ExecuteMotion goal 의 프레임(가칭)
    direction_order: [POS_X, NEG_X, POS_Y, NEG_Y]   # 모서리 탐색 순서. 기동할 때만 읽는다
    event_wait_timeout_s: 1.0        # Result 가 가리킨 ContactEvent 를 기다리는 한도. 넘으면 실패(TIMEOUT)
    stop_confirm_timeout_s: 5.0      # 정지 완료(connected && !moving)를 기다리는 한도. 넘으면 실패(ROBOT_STATUS_LOST)
    server_wait_timeout_s: 2.0       # 상대 서버(/robot/execute_motion · /contact/tare)의 미기동 판단

# mqtt_bridge:                       # (병후)
#   ros__parameters:
