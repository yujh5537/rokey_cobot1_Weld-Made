# source:=sim 파라미터 (Virtual Mode + 가상 직육면체)
#
# - 단위: m · N · s (docs/contracts/units-frames.md). 좌표는 Base(base_link 가칭) 기준이다.
# - 아래 수치는 BRD 의 "설계 출발값"이거나 sim 전용 가상값이다. 실측값이 아니다.
# - "계약 이름" 표시가 있는 파라미터는 SetConfig 가 이름으로 전파한다(ros-interfaces.md 6.4). 이름을 바꾸지 않는다.
# - over_force_n, drop_limit_m 은 여러 노드가 같은 값을 써야 한다(7.2). test/test_config.py 가 검사한다.
# - 최상위 키는 노드 이름이다. 다른 노드의 파라미터는 각 담당자가 자기 절에 추가한다.

contact_detector:
  ros__parameters:
    source: sim                      # 'sim' | 'robot_force' (BRD 4.1.6)
    contact_threshold_n: 3.0         # 계약 이름. 접촉 임계 |F - F0|. 출발값 3~5 N 의 하한
    edge_drop_m: 0.0005              # 계약 이름. 접촉 소실로 보는 z 급강하. 출발값 0.5 mm
    debounce_n: 3                    # 계약 이름. 연속 N 회 유지되면 확정. 출발값 3
    over_force_n: 30.0               # 계약 이름. 과대 외력(원시 |F|). 출발값 30 N

    # --- sim 입력원 전용: 가상 직육면체 (T07). 실제 부재와 무관한 가상값 ---
    sim_box_center_xy_m: [0.40, 0.00]      # 윗면 중심의 Base x, y
    sim_box_size_m: [0.10, 0.06, 0.04]     # 가로(x) · 세로(y) · 높이(z)
    sim_support_z_m: 0.00                  # 지지면의 Base z. 윗면 z = 이 값 + 높이
    sim_stiffness_n_per_m: 5000.0          # 가상 외력 = 강성 x 윗면 침투 깊이 (1 mm 침투 = 5 N)
    sim_tip_radius_m: 0.003                # 가상 팁 반지름. 모서리를 지난 뒤의 가상 하강량 계산에 쓴다
    sim_fall_speed_mps: 0.01               # 팁이 윗면을 완전히 벗어난 뒤의 가상 하강 속도

safety_monitor:
  ros__parameters:
    over_force_n: 30.0               # 계약 이름. contact_detector 와 같은 값
    drop_limit_m: 0.005              # 계약 이름. SLIDE 첫 샘플 z 기준 하강 제한. 출발값 5 mm

robot_manager:
  ros__parameters:
    drop_limit_m: 0.005              # 계약 이름. safety_monitor 와 같은 값
    # slide_target_force_n:          # 계약 이름. 값 TBD (학민)

